      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /media:
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload an image.
      description: >
        Requires `catalog.write` (manager+). Generates thumb/card/full
        sizes as WebP (ADR-008). `400 fields.file: invalid` for an
        unsupported format, `400 fields.file: too_long` over the size
        limit. Decoding and deriving is bounded by a process-wide
        admission queue; `429` means the server already has as many
        uploads in flight as it's willing to hold — retry after the
        given delay.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MediaUpload"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFile"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /products/{id}/images:
    post:
      operationId: addProductImage
      tags: [media]
      summary: Attach an uploaded image to a product.
      description: >
        Requires `catalog.write` (manager+). `400 fields.mediaId:
        invalid` once the product already has 8 images (D-34); `409
        CONFLICT details.field: mediaId` when this media file is already
        attached to the product (`product_images` unique
        `(product_id, media_id)`, docs/04-DATA-MODEL.md § 2).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductImageCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /products/{id}/images/{imageId}:
    patch:
      operationId: updateProductImage
      tags: [media]
      summary: Retag an image's variant and/or cover status.
      description: >
        Requires `catalog.write` (manager+, D-43). Partial update — only
        provided fields change; `variantId` is nullable (D-35): explicit
        `null` unties the image from its variant, leaving it product-level.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductImagePatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeProductImage
      tags: [media]
      summary: Remove an image from a product.
      description: Requires `catalog.write` (manager+). Hard delete (join row).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{id}/images/order:
    patch:
      operationId: reorderProductImages
      tags: [media]
      summary: Reorder a product's images and/or change its cover image.
      description: Requires `catalog.write` (manager+).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductImageOrder"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImageList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List the shop's suppliers.
      description: Requires `manager+`. Cursor-paginated.
      parameters:
        - name: q
          in: query
          description: Free-text search over supplier name (Postgres ILIKE/trigram).
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Create a supplier.
      description: Requires `manager+`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /suppliers/{id}:
    get:
      operationId: getSupplier
      tags: [suppliers]
      summary: Get a supplier.
      description: Requires `manager+`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update a supplier.
      description: >
        Requires `manager+`. Partial update — only provided fields
        change; `contactName`, `phone`, `telegramUsername` and `note`
        are nullable (D-35): explicit `null` clears the field.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteSupplier
      tags: [suppliers]
      summary: Soft-delete a supplier.
      description: Requires `manager+`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /purchases:
    get:
      operationId: listPurchases
      tags: [purchases]
      summary: List the shop's purchases.
      description: Requires `manager+`. Cursor-paginated.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PurchaseStatus"
        - name: supplierId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createPurchase
      tags: [purchases]
      summary: Create a draft purchase.
      description: >
        Requires `manager+`. `number` is server-generated (`P-000001`
        style, D-45) and `totalCost` is computed server-side from
        `items` (hard rule 8) — neither is accepted in the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /purchases/{id}:
    get:
      operationId: getPurchase
      tags: [purchases]
      summary: Get a purchase.
      description: Requires `manager+`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePurchase
      tags: [purchases]
      summary: Update a draft purchase.
      description: >
        Requires `manager+`. Only while `status: draft` — `409
        PURCHASE_NOT_DRAFT` otherwise. Partial update — only provided
        fields change; `supplierInvoiceNo` and `note` are nullable
        (D-35): explicit `null` clears the field. `items`, when
        provided, replaces the full item list.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasePatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The purchase is not in `draft` status. `409 PURCHASE_NOT_DRAFT`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /purchases/{id}/receive:
    post:
      operationId: receivePurchase
      tags: [purchases]
      summary: Receive a draft purchase.
      description: >
        Requires `manager+`. Writes one `purchase_in` stock movement per
        item in the same transaction and sets each received variant's
        `costOverride` to that line's `unitCost` (D-42, last purchase
        cost, no weighted average). Accepts `Idempotency-Key` (docs/05-API.md
        § Conventions): a replay with the same key returns the original
        result.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            `409 PURCHASE_ALREADY_RECEIVED` or `409
            PURCHASE_ALREADY_CANCELLED` when the purchase is not
            `draft`; `409 IDEMPOTENCY_KEY_REUSED` when the same key was
            already used for a different request; `409 CONFLICT
            details.reason: "deadlock"` when a concurrent write could
            not be serialized — safe to retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /purchases/{id}/cancel:
    post:
      operationId: cancelPurchase
      tags: [purchases]
      summary: Cancel a purchase.
      description: >
        Requires `manager+`. Cancelling a `draft` purchase is a plain
        status change; cancelling a `received` purchase writes reversing
        stock movements, which fail with `409 STOCK_INSUFFICIENT` if the
        received stock has already been sold or moved below what the
        reversal needs (D-41).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            `409 PURCHASE_ALREADY_CANCELLED` when already cancelled;
            `409 STOCK_INSUFFICIENT details.variantId/locationId/available`
            when reversing would take a level below zero; `409 CONFLICT
            details.reason: "deadlock"` when a concurrent write could
            not be serialized — safe to retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /stock/levels:
    get:
      operationId: listStockLevels
      tags: [stock]
      summary: List stock levels per variant and location.
      description: >
        Any authenticated role (D-40) — cashiers see exact quantities,
        never cost. Cursor-paginated, newest variant first, then location
        (D-92).
      parameters:
        - name: variantId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: productId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockLevelList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /stock/movements:
    get:
      operationId: listStockMovements
      tags: [stock]
      summary: List stock movements (the append-only ledger).
      description: Requires `manager+`. Cursor-paginated.
      parameters:
        - name: variantId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/StockMovementKind"
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovementList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /stock/adjustments:
    post:
      operationId: createStockAdjustment
      tags: [stock]
      summary: Record a manual stock adjustment.
      description: >
        Requires `manager+` (D-46). Writes one `adjustment` stock
        movement through `stock.Service.Move`; a negative `qty` that
        would take the level below zero fails with `409
        STOCK_INSUFFICIENT` (D-41). Accepts `Idempotency-Key`
        (docs/05-API.md § Conventions): a replay with the same key
        returns the original result.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAdjustmentCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovement"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            `409 STOCK_INSUFFICIENT details.variantId/locationId/available`
            when the adjustment would take a level below zero; `409
            IDEMPOTENCY_KEY_REUSED` when the same key was already used
            for a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /stock/transfers:
    post:
      operationId: createStockTransfer
      tags: [stock]
      summary: Transfer stock between two locations.
      description: >
        Requires `manager+`. Writes a `transfer_out` movement at
        `fromLocationId` and a `transfer_in` movement at `toLocationId`
        in the same transaction (`stock.Service.Move`, ADR-006); the
        `transfer_out` side fails with `409 STOCK_INSUFFICIENT` if it
        would take the source level below zero (D-41).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockTransferCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockTransferResult"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            `409 SAME_LOCATION` when `fromLocationId` equals
            `toLocationId`; `409 STOCK_INSUFFICIENT
            details.variantId/locationId/available` when the transfer
            would take the source level below zero; `409 CONFLICT
            details.reason: "deadlock"` when two concurrent transfers
            could not be serialized — safe to retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /stock/low:
    get:
      operationId: listLowStock
      tags: [stock]
      summary: List variants at or below their effective low-stock threshold.
      description: >
        Variants whose total quantity across all locations is at or below the effective threshold (product override, else the shop default; D-44). Only variants that were stocked at least once on active products and variants are listed (D-50). Cursor-paginated, newest variant first (D-92).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockLowList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List the shop's customers.
      description: Requires `cashier+`. Cursor-paginated.
      parameters:
        - name: q
          in: query
          description: >
            Free-text search over `fullName` or `phone` (Postgres
            ILIKE/trigram), same style as `GET /suppliers`.
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer.
      description: Requires `cashier+`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            `409 CONFLICT details.field: "phone"` — a customer with this
            phone already exists in the shop (same pattern as supplier
            name uniqueness).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer.
      description: Requires `cashier+`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer.
      description: >
        Requires `manager+`. Partial update — only provided fields
        change; `phone`, `telegramUsername` and `note` are nullable
        (D-35 clearing rule, same as `SupplierPatch`): explicit `null`
        clears the field. `tags`, when provided, replaces the full array.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            `409 CONFLICT details.field: "phone"` — another customer in
            the shop already has this phone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Soft-delete a customer.
      description: Requires `manager+`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List the shop's sales.
      description: >
        Requires `cashier+` — a cashier may list every sale for the whole
        shop and any day, not only their own (D-63); `unitCost` and
        margin never appear on this shape regardless. Cursor-paginated,
        newest first.
      parameters:
        - name: from
          in: query
          description: >
            Inclusive lower bound, `YYYY-MM-DD`, interpreted as the start
            of that calendar day in the shop timezone.
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: >
            Inclusive upper bound, `YYYY-MM-DD`, interpreted as the end
            of that calendar day in the shop timezone.
          required: false
          schema:
            type: string
            format: date
        - name: locationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: cashierId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: customerId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SaleKind"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SaleStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createSale
      tags: [sales]
      summary: Complete a quick sale.
      description: >
        Requires `cashier+`. Line prices always come from the catalogue
        (promo price when active) — `items` carries only `variantId` and
        `qty`, never a price (D-56); the manual `discount`, if any, is
        capped at the subtotal (D-57). Writes one `sale_out` stock
        movement per line and the sale in the same transaction
        (docs/03-ARCHITECTURE.md § Quick sale); the response is the
        completed, immutable sale (ADR-014). Accepts `Idempotency-Key`
        (docs/05-API.md § Conventions): a replay with the same key
        returns the original result.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            `409 STOCK_INSUFFICIENT details.variantId/locationId/available`
            when a line would take a level below zero (unless the shop
            allows negative stock); `409 DISCOUNT_EXCEEDS_SUBTOTAL` when
            `discount` is greater than the computed subtotal (D-57); `409
            IDEMPOTENCY_KEY_REUSED` when the same key was already used
            for a different request; `409 CONFLICT details.reason:
            "deadlock"` when a concurrent write could not be serialized —
            safe to retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sales/{id}:
    get:
      operationId: getSale
      tags: [sales]
      summary: Get a sale.
      description: >
        Requires `cashier+` — a cashier may view any sale (D-63);
        `unitCost` on `items` is present only for manager+ (ADR-010).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /sales/{id}/void:
    post:
      operationId: voidSale
      tags: [sales]
      summary: Void a completed sale.
      description: >
        Requires `manager+`. Allowed only on the sale's own calendar day
        in the shop timezone (D-59) and only while it has no return
        referencing it (D-62) — afterwards the correction is a return.
        Writes a `sale_void_in` movement for every line and sets `status:
        voided` (ADR-014); a voided sale is otherwise unchanged and
        stays immutable.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleVoid"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            `409 SALE_ALREADY_VOIDED` when the sale is already voided;
            `409 SALE_VOID_WINDOW_CLOSED` once its calendar day has
            passed in the shop timezone (D-59); `409 SALE_HAS_RETURNS`
            when a return already references this sale (D-62); `409
            SALE_NOT_VOIDABLE` when the sale is itself a return (D-66).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sales/{id}/return:
    post:
      operationId: createSaleReturn
      tags: [sales]
      summary: Return part or all of a completed sale.
      description: >
        Requires `manager+`. Per line, the returned quantity may not
        exceed sold minus already returned (D-58); stock returns to the
        sale's location with `return_in` movements. The refund for each
        returned line is its `lineTotal` minus that line's proportional
        share of the sale's discount (share = `lineTotal / subtotal`,
        rounded to 2 decimals so the sum never exceeds the sale's `total`,
        D-61); the refund is recorded with the sale's original payment
        method, with no time limit. The response is a new sale of `kind:
        return` whose `originalSaleId` is `{id}`. Accepts
        `Idempotency-Key` (docs/05-API.md § Conventions): a replay with
        the same key returns the original result.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleReturnCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            `409 RETURN_EXCEEDS_SOLD details.saleItemId` when a line's
            returned quantity would exceed sold minus already returned;
            `409 SALE_ALREADY_VOIDED` when the original sale is voided;
            `409 SALE_NOT_RETURNABLE` when the target sale is a return
            (D-66); `409 IDEMPOTENCY_KEY_REUSED` when the same key was
            already used for a different request; `409 CONFLICT
            details.reason: "deadlock"` when a concurrent write could not
            be serialized — safe to retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sales/drafts:
    get:
      operationId: listSaleDrafts
      tags: [sales]
      summary: List the shop's draft sales.
      description: >
        Requires `cashier+` — any staff who may create a sale can list
        every draft for the whole shop, shared across devices (D-87).
        Cursor-paginated, newest first.
      parameters:
        - name: createdBy
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleDraftList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createSaleDraft
      tags: [sales]
      summary: Save a draft sale.
      description: >
        Requires `cashier+`. Like `POST /sales`, `items` carries only
        `variantId`/`qty` — prices are never stored on a draft, only
        computed at read time (D-67, D-87). No stock movement or
        availability change while the draft exists (D-88).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleDraftCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleDraft"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            `409 DISCOUNT_EXCEEDS_SUBTOTAL` when `discount` is greater
            than the computed subtotal (D-57).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sales/drafts/{id}:
    get:
      operationId: getSaleDraft
      tags: [sales]
      summary: Get a draft sale.
      description: >
        Requires `cashier+`. `items[].unitPrice`/`lineTotal`,
        `subtotal`, `discountAmount` and `estimatedTotal` are computed
        server-side from the catalogue's current prices at the moment of
        the read (D-67, D-87) — never stored.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleDraft"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSaleDraft
      tags: [sales]
      summary: Edit a draft sale.
      description: >
        Requires `cashier+`, and either the draft's own creator or
        `manager+` — a draft whose `createdBy` is `null` may only be
        edited by `manager+` (D-89). `items`, when present, replaces the
        whole line set. `customerId`, `discountReason` and `note` are
        nullable (D-35): explicit `null` clears the field.
        `discountType`/`discountValue` are nullable as a pair: explicit
        `null` on either clears the discount entirely — even when the
        other half of the pair carries a real value in the same
        request — the same pairing rule `05-API.md`'s promo bullet
        describes for `promoPrice`/`promoFrom`/`promoTo`; naming only
        one of the two with a non-null value keeps the other's
        already-stored value; naming one non-null while nothing is
        stored for the pair is `400 VALIDATION_FAILED` on the missing
        half.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleDraftPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleDraft"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            `409 DISCOUNT_EXCEEDS_SUBTOTAL` when the resulting discount
            is greater than the computed subtotal (D-57).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSaleDraft
      tags: [sales]
      summary: Delete a draft sale.
      description: >
        Requires `cashier+`, and either the draft's own creator or
        `manager+` (D-89's same rule as `PATCH`). Hard delete, no ledger
        effect — a draft never moved stock (D-88).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /sales/drafts/{id}/complete:
    post:
      operationId: completeSaleDraft
      tags: [sales]
      summary: Complete a draft sale.
      description: >
        Requires `cashier+` — any staff who may create a sale, not only
        the draft's own creator. Recomputes every line's price and the
        discount from the catalogue's current state (D-56/D-67), the same
        way `POST /sales` would from an equivalent body, in the same
        transaction as the draft's own deletion (D-87); the response is
        the newly completed, immutable `Sale`, now carrying a sale
        number the draft never had. Accepts `Idempotency-Key`
        (docs/05-API.md § Conventions), the same as `POST /sales`: a
        replay with the same key returns the original result.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleDraftComplete"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            `409 STOCK_INSUFFICIENT details.variantId/locationId/available`
            when a line can no longer be fulfilled (D-88 — the client
            shows which line and lets the user edit the draft); `409
            DISCOUNT_EXCEEDS_SUBTOTAL` when the draft's discount is
            greater than the recomputed subtotal (D-57); `409
            IDEMPOTENCY_KEY_REUSED` when the same key was already used
            for a different request; `409 CONFLICT details.reason:
            "deadlock"` when a concurrent write could not be serialized —
            safe to retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            `422 VALIDATION_FAILED details.fields` naming
            `items[<index>].variantId: invalid` when that line's variant
            or product is inactive or was soft-deleted since the draft
            was created (`available: false` on a read, D-96) — the
            request is well-formed, but the draft can no longer be
            completed as it stands; the client shows which line and
            lets the user edit the draft (D-88).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reports/sales/summary:
    get:
      operationId: getSalesSummaryReport
      tags: [reports]
      summary: Sales summary for a period.
      description: >
        Requires `cashier+`. For manager+, `from`/`to` are required
        (`400 VALIDATION_FAILED` if missing) and scope the whole shop
        unless `locationId` narrows it; `cost` and `margin` are present
        only for manager+ (ADR-010). For a cashier, `from`, `to` and
        `locationId` are ignored — the server always uses today in the
        shop timezone and that cashier's own sales, and echoes the
        effective `from`/`to`/`cashierId` it used in the response (D-55).
      parameters:
        - name: from
          in: query
          description: >
            `YYYY-MM-DD`, inclusive. Required for manager+; ignored for
            a cashier (see summary above).
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: >
            `YYYY-MM-DD`, inclusive. Required for manager+; ignored for
            a cashier (see summary above).
          required: false
          schema:
            type: string
            format: date
        - name: locationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesSummaryReport"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /reports/sales/by-product:
    get:
      operationId: listSalesByProduct
      tags: [reports]
      summary: Sales by product for a period.
      description: >
        Requires `manager+`. Sorted by `revenue` descending,
        cursor-paginated. `cost`/`margin` are present for manager+
        (ADR-010) — kept optional in the schema for symmetry with other
        role-shaped responses, not because a cashier can call this
        endpoint.
      parameters:
        - name: from
          in: query
          description: "`YYYY-MM-DD`, inclusive."
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: "`YYYY-MM-DD`, inclusive."
          required: true
          schema:
            type: string
            format: date
        - name: locationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesByProductList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /content/{key}:
    get:
      operationId: getContent
      tags: [content]
      summary: Get a content block's saved locales.
      description: >
        Requires `manager+`. Returns every locale saved for `key`
        (`locales.uz`/`ru`/`en`, each absent when that locale was never
        saved) — no fallback here (O-19); `GET /public/shop`, a later
        task, applies the requested → uz fallback (D-104) for the public
        landing.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ContentKey"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentResource"
        "400":
          description: "`key` is not one of `ContentKey`'s values. `400 VALIDATION_FAILED details.fields.key: invalid`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: putContent
      tags: [content]
      summary: Save one locale of a content block.
      description: >
        Requires `manager+`. Upserts `(shop_id, key, locale)`; `data` is
        validated against `key`'s O-19 shape (`ContentHero`/`About`/
        `Hours`/`Contacts`/`Social`/`Seo`) — unknown fields and a missing
        required field are both `422 VALIDATION_FAILED details.fields`.
        Saving one locale never touches another (D-104: a block may have
        only some locales filled).
      parameters:
        - name: key
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ContentKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentPut"
      responses:
        "200":
          description: OK. Returns the stored block.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentBlock"
        "400":
          description: "`key` is not one of `ContentKey`'s values. `400 VALIDATION_FAILED details.fields.key: invalid`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >
            `422 VALIDATION_FAILED details.fields` naming each field that
            fails `key`'s schema (O-19) — missing required, unknown
            field, an invalid `hours.days` set (not exactly 7 distinct
            `mon`..`sun` values, or `open`/`close` missing or `open` not
            before `close` on a non-`closed` day), or a `mapUrl` that is
            not `https`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /public/shop:
    get:
      operationId: getPublicShop
      tags: [public]
      summary: Shop identity and landing content blocks.
      description: >
        No auth (`security: []`). Resolves the shop named by
        `PUBLIC_SHOP_SLUG` (D-105); `404 NOT_FOUND` if it does not exist.
        `blocks.*` is absent for a key with no saved content in any
        locale; a key with content in some locale but not the requested
        one falls back to `uz` (D-104) and sets `translationFallback`.
        `blocks.hero.image` resolves `imageMediaId` to its `MediaUrls`
        set when the media exists. Cached 60 s per resolved locale;
        `Cache-Control: public, max-age=60`, strong `ETag`,
        `If-None-Match` → `304` (O-20).
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicShop"
        "404":
          $ref: "#/components/responses/NotFound"

  /public/categories:
    get:
      operationId: listPublicCategories
      tags: [public]
      summary: Active categories with their public product count.
      description: >
        No auth. Not cursor-paginated (a shop has few categories).
        `productCount` counts only active, non-deleted products in that
        category (O-20). Cached 60 s per resolved locale.
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCategoryList"
        "404":
          $ref: "#/components/responses/NotFound"

  /public/products:
    get:
      operationId: listPublicProducts
      tags: [public]
      summary: Browse the public catalogue.
      description: >
        No auth. Cursor-paginated, newest first (D-92). Only active
        products; a product with no category is included with
        `categorySlug: null`, one whose category is inactive is excluded
        (O-22). `price`/`availability` are product-level (D-103/O-20),
        not per-variant — see `GET /public/products/{slug}` for that.
        Cached 60 s per resolved locale and query.
      security: []
      parameters:
        - name: category
          in: query
          description: Filter to one category's slug.
          required: false
          schema:
            type: string
            maxLength: 100
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
        - name: q
          in: query
          description: Free-text search over product name (Postgres ILIKE/trigram).
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProductList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/NotFound"

  /public/products/{slug}:
    get:
      operationId: getPublicProductBySlug
      tags: [public]
      summary: One public product by slug.
      description: >
        No auth. `404 NOT_FOUND` for an unknown, inactive, or
        inactive-category product (same visibility rule as the list,
        O-22). Each variant carries its own `price`/`availability`
        (D-67/D-68/O-20); only active variants are listed. Cached 60 s
        per resolved locale.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPublic"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: savdo_session
      description: >
        Session cookie set by `POST /auth/login` for `client: web`
        (`SameSite=Lax`, D-29). Every mutating request (POST/PATCH/PUT/
        DELETE) authenticated this way must also send `X-Requested-With:
        savdo`; requests without it are rejected as a CSRF check enforced
        by middleware (ADR-005, docs/05-API.md § Conventions).
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Opaque session token returned by `POST /auth/login` for `client:
        mobile` (ADR-005), sent as `Authorization: Bearer <token>`.

  schemas:
    Healthz:
      type: object
      description: Response body for `GET /healthz`.
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]

    Readiness:
      type: object
      description: Response body for `GET /readyz` (200 and 503 share this shape).
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          required:
            - db
          properties:
            db:
              type: string
              enum: [ok, error]

    ErrorCode:
      type: string
      description: >
        Machine-readable error codes (ADR-013). A client translates a code
        to a display sentence; the API never returns one. Adding a new
        error code means adding it here first.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - INTERNAL
        - STOCK_INSUFFICIENT
        - PURCHASE_NOT_DRAFT
        - PURCHASE_ALREADY_RECEIVED
        - PURCHASE_ALREADY_CANCELLED
        - SAME_LOCATION
        - IDEMPOTENCY_KEY_REUSED
        - DISCOUNT_EXCEEDS_SUBTOTAL
        - SALE_ALREADY_VOIDED
        - SALE_VOID_WINDOW_CLOSED
        - SALE_HAS_RETURNS
        - SALE_NOT_VOIDABLE
        - SALE_NOT_RETURNABLE
        - RETURN_EXCEEDS_SOLD

    Error:
      type: object
      description: The error envelope every non-2xx JSON response uses (ADR-013).
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            details:
              type: object
              description: >
                Optional machine-readable context, shape depends on `code`.
                For `VALIDATION_FAILED` this is `{ "fields": { "<field>":
                "<reason>" } }`.

    Decimal:
      type: string
      format: decimal
      pattern: '^-?\d+(\.\d+)?$'
      description: money and quantities as decimal strings (ADR-007)

    Locale:
      type: string
      description: A UI/data locale (ADR-012).
      enum: [uz, ru, en]

    Role:
      type: string
      description: A user's role (04-DATA-MODEL.md § 7 Permissions).
      enum: [owner, manager, cashier]

    StaffRole:
      type: string
      description: >
        The roles the owner can assign when creating or editing a staff
        member. `owner` is not assignable — there is exactly one owner,
        seeded (D-30).
      enum: [manager, cashier]

    SessionClient:
      type: string
      description: Which client created a session (D-29).
      enum: [web, mobile]

    LocationKind:
      type: string
      enum: [store, warehouse]

    User:
      type: object
      required:
        - id
        - username
        - fullName
        - phone
        - role
        - locale
        - isActive
        - lastLoginAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        fullName:
          type: string
        phone:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/Role"
        locale:
          $ref: "#/components/schemas/Locale"
        isActive:
          type: boolean
        lastLoginAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    UserList:
      type: object
      description: Cursor-paginated envelope for `GET /staff`.
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        nextCursor:
          type: ["string", "null"]

    Shop:
      type: object
      required:
        - id
        - slug
        - name
        - currency
        - timezone
        - defaultLocale
        - allowNegativeStock
        - updateCostOnPurchase
        - lowStockThreshold
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        currency:
          type: string
          description: ISO 4217 currency code, one per shop (ADR-007). `UZS` in MVP.
        timezone:
          type: string
          description: IANA timezone name, e.g. `Asia/Tashkent`.
        defaultLocale:
          $ref: "#/components/schemas/Locale"
        allowNegativeStock:
          type: boolean
        updateCostOnPurchase:
          type: boolean
        lowStockThreshold:
          type: integer
          description: >
            Shop-wide default low-stock threshold (D-44); a product may
            override it with its own `lowStockThreshold`.

    ShopPatch:
      type: object
      description: Partial update — only provided fields change.
      properties:
        name:
          type: string
        timezone:
          type: string
        defaultLocale:
          $ref: "#/components/schemas/Locale"
        allowNegativeStock:
          type: boolean
        updateCostOnPurchase:
          type: boolean
        lowStockThreshold:
          type: integer

    Location:
      type: object
      required:
        - id
        - name
        - kind
        - isDefault
        - isActive
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LocationKind"
        isDefault:
          type: boolean
        isActive:
          type: boolean

    LocationList:
      type: object
      description: Cursor-paginated envelope for `GET /locations`.
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Location"
        nextCursor:
          type: ["string", "null"]

    LocationCreate:
      type: object
      required:
        - name
        - kind
      properties:
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LocationKind"
        isDefault:
          type: boolean

    LocationPatch:
      type: object
      description: Partial update — only provided fields change.
      properties:
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LocationKind"
        isDefault:
          type: boolean
        isActive:
          type: boolean

    Session:
      type: object
      required:
        - id
        - client
        - userAgent
        - ip
        - createdAt
        - lastSeenAt
        - expiresAt
        - current
      properties:
        id:
          type: string
          format: uuid
        client:
          $ref: "#/components/schemas/SessionClient"
        userAgent:
          type: ["string", "null"]
        ip:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: >
            Recomputed on every authenticated use, sliding per `client`
            (D-29): 30 days for `mobile`, 7 days for `web`.
        current:
          type: boolean
          description: Whether this is the session the request was authenticated with.

    SessionList:
      type: object
      description: Cursor-paginated envelope for `GET /auth/sessions`.
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        nextCursor:
          type: ["string", "null"]

    LoginRequest:
      type: object
      required:
        - username
        - password
        - client
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 128
        client:
          $ref: "#/components/schemas/SessionClient"

    LoginResponse:
      type: object
      required:
        - user
        - session
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/Session"
        token:
          type: string
          description: >
            Bearer token for `client: mobile` only. Absent for `client:
            web`, which authenticates with the `savdo_session` cookie
            instead.

    Me:
      type: object
      required:
        - user
        - shop
        - permissions
      properties:
        user:
          $ref: "#/components/schemas/User"
        shop:
          $ref: "#/components/schemas/Shop"
        permissions:
          type: array
          items:
            type: string
          description: >
            Machine-readable capability strings the UI uses to show/hide
            actions. The API remains the enforcement point (ADR-010).

    StaffCreate:
      type: object
      required:
        - username
        - password
        - fullName
        - role
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 128
        fullName:
          type: string
        phone:
          type: string
        role:
          $ref: "#/components/schemas/StaffRole"
        locale:
          $ref: "#/components/schemas/Locale"

    StaffPatch:
      type: object
      description: Partial update — only provided fields change.
      properties:
        fullName:
          type: string
        phone:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/StaffRole"
        isActive:
          type: boolean
        locale:
          $ref: "#/components/schemas/Locale"

    SetStaffPassword:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 128

    TranslationEntry:
      type: object
      description: One locale's name/description for a translatable entity.
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string

    Translations:
      type: object
      description: >
        Per-locale name/description (ADR-012), keyed by `Locale`. On
        create, an entry for the shop's own default locale is required —
        expressible only as a service-level rule, since the JSON Schema
        can't know a given shop's `defaultLocale` value. On PATCH, each
        provided locale entry fully replaces the stored entry for that
        locale; omitted locales are left unchanged. Response fields
        outside this object (`name`/`description`/`locale`/
        `translationFallback`) are the entity resolved for the caller's
        `Accept-Language`, fallback order `requested → uz → any`.
      properties:
        uz:
          $ref: "#/components/schemas/TranslationEntry"
        ru:
          $ref: "#/components/schemas/TranslationEntry"
        en:
          $ref: "#/components/schemas/TranslationEntry"

    Unit:
      type: object
      description: A unit of measure (docs/04-DATA-MODEL.md § 2). Seeded, read-only in Phase 2.
      required:
        - id
        - code
        - precision
        - name
        - locale
        - translationFallback
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: e.g. `pcs`, `kg`, `m`.
        precision:
          type: integer
          description: Decimal places a quantity in this unit is stored/displayed with (0 for `pcs`, 3 for `kg`).
        name:
          type: string
          description: Resolved for the caller's `Accept-Language`.
        locale:
          $ref: "#/components/schemas/Locale"
        translationFallback:
          type: boolean

    UnitList:
      type: object
      description: Flat envelope for `GET /units` (not cursor-paginated).
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Unit"

    AttributeDefinition:
      type: object
      description: A per-shop variant attribute, e.g. size or colour (D-32).
      required:
        - id
        - code
        - sortOrder
        - name
        - locale
        - translationFallback
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Stable key `product_variants.attributes` values are keyed by, e.g. `size`.
        sortOrder:
          type: integer
        name:
          type: string
          description: Resolved for the caller's `Accept-Language`.
        locale:
          $ref: "#/components/schemas/Locale"
        translationFallback:
          type: boolean
        translations:
          $ref: "#/components/schemas/Translations"

    AttributeDefinitionCreate:
      type: object
      required:
        - code
        - translations
      properties:
        code:
          type: string
        sortOrder:
          type: integer
        translations:
          $ref: "#/components/schemas/Translations"

    AttributeDefinitionPatch:
      type: object
      description: Partial update — only provided fields change. `code` is not patchable.
      properties:
        sortOrder:
          type: integer
        translations:
          $ref: "#/components/schemas/Translations"

    AttributeDefinitionList:
      type: object
      description: Flat envelope for `GET /attribute-definitions` (not cursor-paginated).
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AttributeDefinition"

    Category:
      type: object
      required:
        - id
        - parentId
        - slug
        - sortOrder
        - isActive
        - imageId
        - name
        - description
        - locale
        - translationFallback
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: ["string", "null"]
          format: uuid
        slug:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        imageId:
          type: ["string", "null"]
          format: uuid
        name:
          type: string
          description: Resolved for the caller's `Accept-Language`.
        description:
          type: ["string", "null"]
        locale:
          $ref: "#/components/schemas/Locale"
        translationFallback:
          type: boolean
        translations:
          $ref: "#/components/schemas/Translations"

    CategoryCreate:
      type: object
      required:
        - translations
      properties:
        parentId:
          type: string
          format: uuid
        slug:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        imageId:
          type: string
          format: uuid
        translations:
          $ref: "#/components/schemas/Translations"

    CategoryPatch:
      type: object
      description: Partial update — only provided fields change.
      properties:
        parentId:
          type: ["string", "null"]
          format: uuid
          description: Explicit `null` moves the category to the top level.
        slug:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        imageId:
          type: ["string", "null"]
          format: uuid
          description: Explicit `null` removes the category's image.
        translations:
          $ref: "#/components/schemas/Translations"

    CategoryList:
      type: object
      description: Flat envelope for `GET /categories` (not cursor-paginated; the client builds the tree from `parentId`).
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    AttributeValues:
      type: object
      description: >
        A variant's attribute values, keyed by `attribute_definitions.code`
        (e.g. `{"size": "L", "color": "blue"}`, D-32).
      additionalProperties:
        type: string

    Availability:
      type: string
      description: Public/bot-facing stock signal — never a quantity (ADR-010, hard rule 4/5).
      enum: [in_stock, low, out_of_stock]

    Variant:
      type: object
      description: >
        `costOverride` is present only when the caller has the
        `cost.read` permission; absent (not null) otherwise (ADR-010).
      required:
        - id
        - sku
        - barcode
        - attributes
        - priceOverride
        - isActive
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: ["string", "null"]
        barcode:
          type: ["string", "null"]
        attributes:
          $ref: "#/components/schemas/AttributeValues"
        priceOverride:
          type: ["string", "null"]
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
        costOverride:
          type: ["string", "null"]
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
          description: >
            Present only when the caller has the `cost.read` permission;
            absent (not null) otherwise (ADR-010).
        isActive:
          type: boolean

    VariantPublic:
      type: object
      description: >
        Referenced by `GET /public/products/{slug}` (Phase 6, D-32/D-34).
        No cost, no `isActive` (only active variants are ever returned
        publicly); `availability` replaces any quantity (hard rule 4/5).
      required:
        - id
        - sku
        - barcode
        - attributes
        - priceOverride
        - availability
        - price
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: ["string", "null"]
        barcode:
          type: ["string", "null"]
        attributes:
          $ref: "#/components/schemas/AttributeValues"
        priceOverride:
          type: ["string", "null"]
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
        availability:
          $ref: "#/components/schemas/Availability"
        price:
          $ref: "#/components/schemas/PublicPrice"

    VariantCreate:
      type: object
      required:
        - attributes
      properties:
        sku:
          type: string
        barcode:
          type: string
        attributes:
          $ref: "#/components/schemas/AttributeValues"
        priceOverride:
          $ref: "#/components/schemas/Decimal"
        costOverride:
          $ref: "#/components/schemas/Decimal"
        isActive:
          type: boolean

    VariantPatch:
      type: object
      description: Partial update — only provided fields change.
      properties:
        sku:
          type: ["string", "null"]
        barcode:
          type: ["string", "null"]
        attributes:
          $ref: "#/components/schemas/AttributeValues"
        priceOverride:
          type: ["string", "null"]
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
        costOverride:
          type: ["string", "null"]
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
        isActive:
          type: boolean

    VariantList:
      type: object
      description: Flat envelope for `GET /products/{id}/variants` (not cursor-paginated).
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Variant"

    Product:
      type: object
      description: >
        `costPrice` and `translations` are present only when the caller
        has the `cost.read` / `catalog.write` permission; absent (not
        null) otherwise (ADR-010).
      required:
        - id
        - categoryId
        - slug
        - sku
        - unitId
        - basePrice
        - promoPrice
        - promoFrom
        - promoTo
        - isActive
        - isFeatured
        - name
        - description
        - locale
        - translationFallback
        - lowStockThreshold
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: ["string", "null"]
          format: uuid
        slug:
          type: string
        sku:
          type: ["string", "null"]
        unitId:
          type: string
          format: uuid
        basePrice:
          $ref: "#/components/schemas/Decimal"
        costPrice:
          type: string
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
          description: >
            Present only when the caller has the `cost.read` permission;
            absent (not null) otherwise (ADR-010).
        promoPrice:
          type: ["string", "null"]
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
        promoFrom:
          type: ["string", "null"]
          format: date-time
        promoTo:
          type: ["string", "null"]
          format: date-time
        isActive:
          type: boolean
        isFeatured:
          type: boolean
        name:
          type: string
          description: Resolved for the caller's `Accept-Language`.
        description:
          type: ["string", "null"]
        locale:
          $ref: "#/components/schemas/Locale"
        translationFallback:
          type: boolean
        translations:
          $ref: "#/components/schemas/Translations"
          description: >
            Present only when the caller has the `catalog.write`
            permission; absent otherwise (ADR-010).
        lowStockThreshold:
          type: ["integer", "null"]
          description: >
            Per-product override of the shop's default low-stock
            threshold (D-44); `null` means "use the shop default".
        variants:
          type: array
          items:
            $ref: "#/components/schemas/Variant"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        coverImage:
          $ref: "#/components/schemas/ProductImage"
          description: >
            `GET /products` list items only (D-83): the product image
            flagged `isCover`, else the first by position, else absent.
            `GET /products/{id}` returns the full `images` array instead
            and does not set this field.

    ProductPublic:
      type: object
      description: >
        Response body for `GET /public/products/{slug}` (Phase 6,
        D-32/D-34). Only active products/variants are ever returned this
        way; variants carry `availability`, never cost or quantity (hard
        rule 4/5). A product with no category has `categoryId`/
        `categorySlug`/`categoryName` all `null` (O-22); one whose
        category is inactive is `404 NOT_FOUND` instead.
      required:
        - id
        - categoryId
        - categorySlug
        - categoryName
        - slug
        - sku
        - unitId
        - basePrice
        - promoPrice
        - promoFrom
        - promoTo
        - isActive
        - isFeatured
        - name
        - description
        - locale
        - translationFallback
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: ["string", "null"]
          format: uuid
        categorySlug:
          type: ["string", "null"]
        categoryName:
          type: ["string", "null"]
          description: Resolved for the caller's `Accept-Language`, same fallback as `name`.
        slug:
          type: string
        sku:
          type: ["string", "null"]
        unitId:
          type: string
          format: uuid
        basePrice:
          $ref: "#/components/schemas/Decimal"
        promoPrice:
          type: ["string", "null"]
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
          description: >
            `null` unless a promo is active right now, per the D-68
            calendar-day rule in the shop's timezone (D-109: a future
            promo is hidden from the public site until it starts). Use
            `price.current`/`price.promoActive` to know what a customer
            actually pays; this field and `promoFrom`/`promoTo` are only
            for showing an active promo's own window, never a preview of
            one still to come.
        promoFrom:
          type: ["string", "null"]
          format: date-time
          description: "`null` unless a promo is active right now (see `promoPrice`)."
        promoTo:
          type: ["string", "null"]
          format: date-time
          description: "`null` unless a promo is active right now (see `promoPrice`)."
        isActive:
          type: boolean
        isFeatured:
          type: boolean
        name:
          type: string
          description: Resolved for the caller's `Accept-Language`.
        description:
          type: ["string", "null"]
        locale:
          $ref: "#/components/schemas/Locale"
        translationFallback:
          type: boolean
        variants:
          type: array
          items:
            $ref: "#/components/schemas/VariantPublic"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"

    PublicPrice:
      type: object
      description: >
        D-67/D-68 effective price, resolved server-side (Phase 6): a
        promo replaces the price entirely on every calendar day in the
        shop's timezone from `promoFrom`'s date to `promoTo`'s date
        inclusive, it is never combined with a price override.
      required:
        - regular
        - current
        - promoActive
      properties:
        regular:
          $ref: "#/components/schemas/Decimal"
          description: The non-promo price (variant `priceOverride` when set, else the product `basePrice`).
        current:
          $ref: "#/components/schemas/Decimal"
          description: What a customer pays right now — the product `promoPrice` when `promoActive`, else `regular`.
        promoActive:
          type: boolean

    PublicHero:
      type: object
      description: >
        `PublicShop.blocks.hero` — `ContentHero`'s fields plus `image`,
        `imageMediaId` resolved to its `MediaUrls` set (O-21). `image` is
        absent when `imageMediaId` is unset or names media that no
        longer exists.
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 200
        tagline:
          type: string
          maxLength: 300
        imageMediaId:
          type: string
          format: uuid
        image:
          $ref: "#/components/schemas/MediaUrls"

    PublicShopBlocks:
      type: object
      description: >
        Each of the six landing sections (D-99), absent when that key has
        no saved content in any locale (D-104) — never present-but-empty.
      properties:
        hero:
          $ref: "#/components/schemas/PublicHero"
        about:
          $ref: "#/components/schemas/ContentAbout"
        hours:
          $ref: "#/components/schemas/ContentHours"
        contacts:
          $ref: "#/components/schemas/ContentContacts"
        social:
          $ref: "#/components/schemas/ContentSocial"
        seo:
          $ref: "#/components/schemas/ContentSeo"

    PublicShop:
      type: object
      description: Response body for `GET /public/shop` (O-21).
      required:
        - name
        - slug
        - currency
        - defaultLocale
        - locale
        - translationFallback
        - blocks
      properties:
        name:
          type: string
        slug:
          type: string
        currency:
          type: string
          description: ISO 4217 currency code (ADR-007). `UZS` in MVP.
        defaultLocale:
          $ref: "#/components/schemas/Locale"
        locale:
          $ref: "#/components/schemas/Locale"
          description: The locale this response was resolved for (requested `Accept-Language`, falling back to `defaultLocale`).
        translationFallback:
          type: boolean
          description: "`true` when any block in `blocks` fell back to `uz` (D-104)."
        blocks:
          $ref: "#/components/schemas/PublicShopBlocks"

    PublicCategory:
      type: object
      description: One row of `GET /public/categories` (O-21).
      required:
        - id
        - slug
        - name
        - productCount
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
          description: Resolved for the caller's `Accept-Language`, falling back to `uz` then any locale (ADR-012).
        productCount:
          type: integer
          description: Active, non-deleted products in this category (O-20).

    PublicCategoryList:
      type: object
      description: Flat envelope for `GET /public/categories` (not cursor-paginated — a shop has few categories).
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicCategory"

    PublicProductListItem:
      type: object
      description: One row of `GET /public/products` (O-21/O-22).
      required:
        - id
        - slug
        - name
        - price
        - availability
        - categorySlug
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
          description: Resolved for the caller's `Accept-Language`, falling back to `uz` then any locale (ADR-012).
        coverImage:
          $ref: "#/components/schemas/ProductImage"
          description: The image flagged `isCover`, else the first by position, else absent (D-83).
        price:
          $ref: "#/components/schemas/PublicPrice"
          description: Product-level (`basePrice`/`promoPrice`), not per-variant — see `GET /public/products/{slug}` for per-variant pricing.
        availability:
          $ref: "#/components/schemas/Availability"
          description: The best availability among the product's active variants (O-20).
        categorySlug:
          type: ["string", "null"]
          description: "`null` for an uncategorized product (O-22)."

    PublicProductList:
      type: object
      description: Cursor-paginated envelope for `GET /public/products`, newest first (D-92).
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicProductListItem"
        nextCursor:
          type: ["string", "null"]

    ProductCreate:
      type: object
      required:
        - unitId
        - basePrice
        - translations
      properties:
        categoryId:
          type: string
          format: uuid
        slug:
          type: string
        sku:
          type: string
        unitId:
          type: string
          format: uuid
        basePrice:
          $ref: "#/components/schemas/Decimal"
        costPrice:
          $ref: "#/components/schemas/Decimal"
        promoPrice:
          $ref: "#/components/schemas/Decimal"
        promoFrom:
          type: string
          format: date-time
        promoTo:
          type: string
          format: date-time
        isActive:
          type: boolean
        isFeatured:
          type: boolean
        lowStockThreshold:
          type: integer

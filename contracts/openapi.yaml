            $ref: "#/components/schemas/Supplier"
        nextCursor:
          type: ["string", "null"]

    PurchaseStatus:
      type: string
      description: docs/04-DATA-MODEL.md § 3.
      enum: [draft, received, cancelled]

    PurchaseItem:
      type: object
      description: >
        One line of a purchase (docs/04-DATA-MODEL.md § 3). `productName`,
        `variantLabel` and `sku` are response-only (never accepted on
        `PurchaseItemCreate`): resolved by the service from the variant and
        product a client only supplies as `variantId`.
      required:
        - id
        - variantId
        - qty
        - unitCost
        - productName
        - variantLabel
        - sku
      properties:
        id:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        qty:
          $ref: "#/components/schemas/Decimal"
        unitCost:
          $ref: "#/components/schemas/Decimal"
        productName:
          type: string
          description: >
            The variant's product name, resolved in the caller's locale
            (same `requested -> uz -> any` fallback as `Product.name`,
            ADR-012). Read-only.
        variantLabel:
          type: string
          description: >
            A short, human label for the variant — its attribute values in
            attribute-definition order (e.g. "L / Blue"), falling back to
            its SKU, then its id (same rule as the admin's own variant
            label). Read-only.
        sku:
          type: ["string", "null"]
          description: The variant's own SKU, if it has one. Read-only.

    PurchaseItemCreate:
      type: object
      required:
        - variantId
        - qty
        - unitCost
      properties:
        variantId:
          type: string
          format: uuid
        qty:
          $ref: "#/components/schemas/Decimal"
        unitCost:
          $ref: "#/components/schemas/Decimal"

    Purchase:
      type: object
      description: >
        `number` and `totalCost` are server-computed, never
        client-supplied (D-45, hard rule 8).
      required:
        - id
        - number
        - supplierId
        - locationId
        - status
        - supplierInvoiceNo
        - receivedAt
        - note
        - totalCost
        - items
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: Server-generated, e.g. `P-000001` (D-45). Read-only.
        supplierId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/PurchaseStatus"
        supplierInvoiceNo:
          type: ["string", "null"]
          description: The supplier's own document number, free text (D-45).
        receivedAt:
          type: ["string", "null"]
          format: date-time
        note:
          type: ["string", "null"]
        totalCost:
          $ref: "#/components/schemas/Decimal"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseItem"
        createdAt:
          type: string
          format: date-time

    PurchaseCreate:
      type: object
      required:
        - supplierId
        - locationId
        - items
      properties:
        supplierId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        supplierInvoiceNo:
          type: string
        note:
          type: string
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/PurchaseItemCreate"

    PurchasePatch:
      type: object
      description: >
        Partial update — only provided fields change; allowed only
        while `status: draft` (409 PURCHASE_NOT_DRAFT otherwise).
        `supplierInvoiceNo` and `note` are nullable (D-35): explicit
        `null` clears the field. `items`, when provided, replaces the
        full item list.
      properties:
        supplierId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        supplierInvoiceNo:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/PurchaseItemCreate"


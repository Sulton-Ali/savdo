    SaleDiscount:
      type: object
      description: >
        A manual per-sale discount (D-52). `value` is a percentage
        (0..100) when `type: percent`, or a fixed sum (>= 0, in shop
        currency) when `type: fixed`; either way it is capped at the
        computed subtotal — `409 DISCOUNT_EXCEEDS_SUBTOTAL` otherwise
        (D-57). Validated server-side; not enforceable by JSON Schema
        since `Decimal` is a string.
      required:
        - type
        - value
      properties:
        type:
          $ref: "#/components/schemas/DiscountType"
        value:
          $ref: "#/components/schemas/Decimal"

    SalePaymentCreate:
      type: object
      required:
        - method
      properties:
        method:
          $ref: "#/components/schemas/PaymentMethod"

    SalePayment:
      type: object
      required:
        - method
        - amount
      properties:
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amount:
          $ref: "#/components/schemas/Decimal"

    SaleItemCreate:
      type: object
      description: >
        No price field — the unit price always comes from the catalogue,
        never the client (D-56, hard rule 8).
      required:
        - variantId
        - qty
      properties:
        variantId:
          type: string
          format: uuid
        qty:
          $ref: "#/components/schemas/Decimal"
          description: >
            Must be greater than zero (validated server-side; not
            enforceable by JSON Schema since `Decimal` is a string).

    SaleItem:
      type: object
      description: >
        One line of a sale or return (docs/04-DATA-MODEL.md § 4).
        `productName` is resolved in the caller's `Accept-Language`
        (same `requested -> uz -> any` fallback as `Product.name`,
        ADR-012, and the same resolution `PurchaseItem.productName`
        uses); `variantLabel` follows the same rule as
        `PurchaseItem.variantLabel`. `unitCost` is present only for a
        caller with the `cost.read` permission — absent (not null) for a
        cashier (D-63, ADR-010).
      required:
        - id
        - variantId
        - productId
        - productName
        - variantLabel
        - qty
        - unitPrice
        - lineTotal
        - returnedQty
      properties:
        id:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productName:
          type: string
        variantLabel:
          type: string
        qty:
          $ref: "#/components/schemas/Decimal"
        unitPrice:
          $ref: "#/components/schemas/Decimal"
          description: >
            The price actually charged for this line. On a return, the
            effective refunded unit price (D-61) — `qty * unitPrice` may
            differ from `lineTotal` by a rounding cent; `lineTotal` is
            authoritative.
        lineTotal:
          $ref: "#/components/schemas/Decimal"
        returnedQty:
          $ref: "#/components/schemas/Decimal"
          description: >
            Quantity of this line already returned. Always `0` on a
            return-kind sale's own items.
        unitCost:
          $ref: "#/components/schemas/Decimal"
          description: >
            Present only when the caller has the `cost.read` permission;
            absent (not null) otherwise (ADR-010, D-63).

    SaleCreate:
      type: object
      description: >
        `items` carries only `variantId` and `qty` — a client-supplied
        price is rejected by the contract shape itself (D-56).
      required:
        - locationId
        - items
        - payment
      properties:
        locationId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SaleItemCreate"
        discount:
          $ref: "#/components/schemas/SaleDiscount"
        discountReason:
          type: string
        note:
          type: string
        payment:
          $ref: "#/components/schemas/SalePaymentCreate"

    Sale:
      type: object
      description: >
        A completed sale is immutable except for the void columns
        (ADR-014). A return is its own `Sale` of `kind: return`, with
        `originalSaleId` pointing at the sale it corrects (D-58).
      required:
        - id
        - number
        - kind
        - status
        - locationId
        - locationName
        - customerId
        - customerName
        - cashierId
        - cashierName
        - originalSaleId
        - subtotal
        - discountAmount
        - discountReason
        - total
        - note
        - completedAt
        - voidedAt
        - voidedBy
        - voidReason
        - payment
        - items
        - hasReturns
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          description: >
            Per-shop, sequential, gap-free (`shops.next_sale_number`
            under row lock). Read-only.
        kind:
          $ref: "#/components/schemas/SaleKind"
        status:
          $ref: "#/components/schemas/SaleStatus"
        locationId:
          type: string
          format: uuid
        locationName:
          type: string
        customerId:
          type: ["string", "null"]
          format: uuid
        customerName:
          type: ["string", "null"]
        cashierId:
          type: string
          format: uuid
        cashierName:
          type: string
        originalSaleId:
          type: ["string", "null"]
          format: uuid
          description: "Set only on a `kind: return` sale — the sale it corrects."
        subtotal:
          $ref: "#/components/schemas/Decimal"
        discountAmount:
          $ref: "#/components/schemas/Decimal"
        discountReason:
          type: ["string", "null"]
        total:
          $ref: "#/components/schemas/Decimal"
        note:
          type: ["string", "null"]
        completedAt:
          type: string
          format: date-time
        voidedAt:
          type: ["string", "null"]
          format: date-time
        voidedBy:
          type: ["string", "null"]
          format: uuid
          description: The staff id who voided the sale.
        voidReason:
          type: ["string", "null"]
        payment:
          $ref: "#/components/schemas/SalePayment"
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleItem"
        hasReturns:
          type: boolean
          description: >
            `true` when a `kind: return` sale references this sale as
            `originalSaleId` (D-62 — such a sale can no longer be
            voided).

    SaleSummary:
      type: object
      description: >
        `Sale` without `items` and without payment details beyond
        `paymentMethod` — the shape `GET /sales` returns (list vs get
        asymmetry, docs/05-API.md § Conventions).
      required:
        - id
        - number
        - kind
        - status
        - locationId
        - locationName
        - customerId
        - customerName
        - cashierId
        - cashierName
        - originalSaleId
        - subtotal
        - discountAmount
        - discountReason
        - total
        - note
        - completedAt
        - voidedAt
        - voidedBy
        - voidReason
        - paymentMethod
        - hasReturns
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
        kind:
          $ref: "#/components/schemas/SaleKind"
        status:
          $ref: "#/components/schemas/SaleStatus"
        locationId:
          type: string
          format: uuid
        locationName:
          type: string
        customerId:
          type: ["string", "null"]
          format: uuid
        customerName:
          type: ["string", "null"]
        cashierId:
          type: string
          format: uuid
        cashierName:
          type: string
        originalSaleId:
          type: ["string", "null"]
          format: uuid
        subtotal:
          $ref: "#/components/schemas/Decimal"
        discountAmount:
          $ref: "#/components/schemas/Decimal"
        discountReason:
          type: ["string", "null"]
        total:
          $ref: "#/components/schemas/Decimal"
        note:
          type: ["string", "null"]
        completedAt:
          type: string
          format: date-time
        voidedAt:
          type: ["string", "null"]
          format: date-time
        voidedBy:
          type: ["string", "null"]
          format: uuid
        voidReason:
          type: ["string", "null"]
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        hasReturns:
          type: boolean

    SaleList:
      type: object
      description: Cursor-paginated envelope for `GET /sales`.
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleSummary"
        nextCursor:
          type: ["string", "null"]

    SaleVoid:
      type: object
      properties:
        reason:
          type: string

    SaleReturnItemCreate:
      type: object
      required:
        - saleItemId
        - qty
      properties:
        saleItemId:
          type: string
          format: uuid
        qty:
          $ref: "#/components/schemas/Decimal"
          description: >
            Must be greater than zero (validated server-side; not
            enforceable by JSON Schema since `Decimal` is a string); may
            not exceed that line's sold quantity minus already returned
            (`409 RETURN_EXCEEDS_SOLD`, D-58).

    SaleReturnCreate:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SaleReturnItemCreate"
        note:
          type: string

    SaleDraftItem:
      type: object
      description: >
        One line of a draft sale (docs/04-DATA-MODEL.md § 4, D-87).
        `unitPrice`/`lineTotal` are resolved from the catalogue at read
        time by the same rule `SaleItem.unitPrice` uses (promo price when
        active, else the variant's override, else the product's base
        price — D-67); a changed price or an expired promo since the
        line was added is reflected immediately, never stale. No
        `unitCost` — a draft never carries cost, for any role (hard rule
        5).
      required:
        - variantId
        - productId
        - productName
        - variantLabel
        - qty
        - unitPrice
        - lineTotal
        - available
      properties:
        variantId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productName:
          type: string
        variantLabel:
          type: string
        qty:
          $ref: "#/components/schemas/Decimal"
        unitPrice:
          $ref: "#/components/schemas/Decimal"
        lineTotal:
          $ref: "#/components/schemas/Decimal"
        available:
          type: boolean
          description: >
            `false` when the line's variant or product has since become
            inactive or was soft-deleted while the draft was open — the
            line still renders (`unitPrice`/`lineTotal` reported as
            `"0.00"`, excluded from `subtotal`) so the draft stays
            editable, but `POST .../complete` fails with `422
            VALIDATION_FAILED` naming it if the line is still present at
            completion time.

    SaleDraftCreate:
      type: object
      description: >
        `items` carries only `variantId` and `qty`, the same as
        `SaleCreate.items` — no client-supplied price (D-56, D-87).
      required:
        - locationId
        - items
      properties:
        locationId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SaleItemCreate"
        discount:
          $ref: "#/components/schemas/SaleDiscount"
        discountReason:
          type: string
        note:
          type: string

    SaleDraftPatch:
      type: object
      description: >
        Partial update — only provided fields change (D-87). `items`,
        when present, replaces the whole line set. `customerId`,
        `discountType`, `discountValue`, `discountReason` and `note` are
        nullable (D-35): explicit `null` clears the field;
        `discountType`/`discountValue` are cleared together as a pair by
        an explicit `null` on either one — even when the other half of
        the pair carries a real value in the same request — the same
        rule `docs/05-API.md`'s promo bullet describes for
        `promoPrice`/`promoFrom`/`promoTo`; naming only one of the two
        with a non-null value keeps the other's already-stored value;
        naming one non-null while nothing is stored for the pair is
        `400 VALIDATION_FAILED` on the missing half.
      properties:
        locationId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SaleItemCreate"
        customerId:
          type: ["string", "null"]
          format: uuid
        discountType:
          type: ["string", "null"]
          description: >
            `percent` or `fixed` (docs/04-DATA-MODEL.md § 4); validated
            server-side, not enforced by JSON Schema.
        discountValue:
          type: ["string", "null"]
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
        discountReason:
          type: ["string", "null"]
        note:
          type: ["string", "null"]

    SaleDraftComplete:
      type: object
      required:
        - paymentMethod
      properties:
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"

    SaleDraft:
      type: object
      description: >
        A mutable, shared, unpaid order (D-87..D-89): editable or
        deletable by its creator or `manager+` until it is completed or
        deleted, at which point `POST /sales/drafts/{id}/complete`
        creates the immutable `Sale` `docs/03-ARCHITECTURE.md`'s ADR-014
        describes. No prices are ever stored — `items`, `subtotal`,
        `discountAmount` and `estimatedTotal` are computed server-side
        from the catalogue's current state on every read (D-67); a draft
        has no sale number, only assigned on completion.
      required:
        - id
        - locationId
        - customerId
        - customerName
        - discount
        - discountReason
        - note
        - items
        - subtotal
        - discountAmount
        - estimatedTotal
        - createdBy
        - createdByName
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        customerId:
          type: ["string", "null"]
          format: uuid
        customerName:
          type: ["string", "null"]
          description: >
            The attached customer's display name, resolved server-side
            (mirrors `Sale.customerName` and this same schema's own
            `createdByName`); `null` when `customerId` is `null` or the
            customer no longer exists.
        discount:
          description: >
            `null` when the draft has no manual discount. The
            OpenAPI 3.1 `anyOf`-with-`null` idiom is used here (rather
            than the `SaleDiscount` `$ref` alone) so this always-present,
            possibly-null field matches `Sale`'s own nullable-field
            convention (`customerId`, `voidedBy`, …) instead of the
            plain-optional shape `SaleCreate.discount`/
            `SaleDraftCreate.discount` use.
            docs/04-DATA-MODEL.md § 4 / D-52.
            `value` is a percentage (0..100) when `type: percent`, or a
            fixed sum (>= 0) when `type: fixed`.
            docs/05-API.md § Conventions.
          anyOf:
            - $ref: "#/components/schemas/SaleDiscount"
            - type: "null"
        discountReason:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleDraftItem"
        subtotal:
          $ref: "#/components/schemas/Decimal"
          description: >
            Sum of every `available` line's `lineTotal` — an unavailable
            line (D-96/§ 04-DATA-MODEL.md § 4) contributes `"0.00"` and
            is excluded.
        discountAmount:
          $ref: "#/components/schemas/Decimal"
          description: >
            The manual discount's amount, computed from `discount`
            against `subtotal` and capped at `subtotal` (D-57) — a
            discount that exceeded the subtotal after the draft's items
            changed since it was set is reported capped here rather than
            failing the read; `PATCH`/`POST` that touch `items` or the
            discount reject the same case outright (`409
            DISCOUNT_EXCEEDS_SUBTOTAL`); a `PATCH` touching neither
            leaves a stale discount alone.
        estimatedTotal:
          $ref: "#/components/schemas/Decimal"
          description: >
            `subtotal` minus `discountAmount` — an estimate, not
            authoritative: `POST .../complete` recomputes everything
            server-side (D-56).
        createdBy:
          type: ["string", "null"]
          format: uuid
          description: >
            The staff id who created the draft; `null` for a draft with
            no creator on record, editable/deletable only by `manager+`
            in that case (D-89). Any staff who may create a sale may
            complete the draft regardless of `createdBy` (D-96).
        createdByName:
          type: ["string", "null"]
          description: >
            The creating user's display name, resolved server-side
            (mirrors `StockMovement.createdByName`, avoiding a second
            lookup by `createdBy`); `null` when `createdBy` is `null` or
            the user no longer exists.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SaleDraftList:
      type: object
      description: Cursor-paginated envelope for `GET /sales/drafts`.
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleDraft"
        nextCursor:
          type: ["string", "null"]

    SalesSummaryReport:
      type: object
      description: >
        docs/00-DECISIONS.md D-55. For a cashier, `from`/`to`/`cashierId`
        are the effective values the server used (today, shop timezone,
        that cashier), not necessarily what was requested.
      required:
        - from
        - to
        - locationId
        - cashierId
        - salesCount
        - returnsCount
        - revenue
        - discounts
        - refunds
        - netRevenue
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        locationId:
          type: ["string", "null"]
          format: uuid
        cashierId:
          type: ["string", "null"]
          format: uuid
          description: >
            Non-null only when the report is scoped to one cashier (a
            cashier caller always gets their own id here; manager+ gets
            `null` for a whole-shop summary). For a cashier, a
            `return`-kind sale is attributed to the original sale's
            cashier, not the (typically manager) staff member who created
            the return (D-58, D-71).
        salesCount:
          type: integer
          description: Count of completed `sale`-kind sales in the period (D-64).
        returnsCount:
          type: integer
          description: >
            Count of completed `return`-kind sales in the period (D-64).
            For a cashier, this counts returns against that cashier's own
            sales — attributed via the original sale's cashier, not the
            return's own cashier — counted on the day the return itself
            happens, not the day of the original sale (D-71).
        revenue:
          $ref: "#/components/schemas/Decimal"
          description: >
            Sum of `total` over completed `sale`-kind sales in the period —
            already net of each sale's own discount (D-64).
        discounts:
          $ref: "#/components/schemas/Decimal"
          description: >
            Sum of `discount_amount` over completed `sale`-kind sales in
            the period (D-64).
        refunds:
          $ref: "#/components/schemas/Decimal"
          description: >
            Sum of `total` over completed `return`-kind sales (refunds) in
            the period (D-64). For a cashier, a return is attributed to
            the original sale's cashier, not the (typically manager)
            staff member who created the return, and counted on the day
            the return itself happens rather than the day of the original
            sale (D-58, D-71) — so a cashier's own-day summary can show
            refunds, and `salesCount: 0`, on a day it made no sales at
            all.
        netRevenue:
          $ref: "#/components/schemas/Decimal"
          description: >
            `revenue - refunds` (D-64), using the D-71 cashier attribution
            of `refunds` above for a cashier. Can be negative on a day
            with refunds against a prior day's sale and no sales of its
            own.
        cost:
          $ref: "#/components/schemas/Decimal"
          description: >
            Present only for manager+ (ADR-010). Sum of `qty * unitCost`
            over items sold minus items returned in the period (D-64).
        margin:
          $ref: "#/components/schemas/Decimal"
          description: >
            Present only for manager+ (ADR-010). `netRevenue - cost`
            (D-64).

    SalesByProductRow:
      type: object
      description: docs/00-DECISIONS.md D-55.
      required:
        - productId
        - productName
        - qtySold
        - qtyReturned
        - revenue
      properties:
        productId:
          type: string
          format: uuid
        productName:
          type: string
          description: Resolved for the caller's `Accept-Language` (ADR-012).
        qtySold:
          $ref: "#/components/schemas/Decimal"
          description: Quantity sold (completed `sale`-kind items) in the period.
        qtyReturned:
          $ref: "#/components/schemas/Decimal"
          description: Quantity returned (completed `return`-kind items) in the period.
        revenue:
          $ref: "#/components/schemas/Decimal"
          description: >
            Net of this product's share of each sale's discount and of
            returns, so summing `revenue` across every row on every page
            equals the sales summary's `netRevenue` for the same period/
            filters (D-64): each sale-leg line's discount share is
            `round(lineTotal * discountAmount / subtotal, 2)`, except the
            last line by `sale_items.id`, which takes the remainder so the
            shares always sum to exactly `discountAmount`; a returned
            line's already-net amount is then subtracted.
        cost:
          $ref: "#/components/schemas/Decimal"
          description: >
            Present only for manager+ (ADR-010); kept optional here for
            symmetry even though this endpoint is manager+ only. Sum of
            `qty * unitCost` over items sold minus items returned (D-64).
        margin:
          $ref: "#/components/schemas/Decimal"
          description: >
            Present only for manager+ (ADR-010); kept optional here for
            symmetry even though this endpoint is manager+ only.
            `revenue - cost` (D-64).

    SalesByProductList:
      type: object
      description: >
        Cursor-paginated envelope for `GET /reports/sales/by-product`,
        sorted by `revenue` descending.
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SalesByProductRow"
        nextCursor:
          type: ["string", "null"]

    ContentKey:
      type: string
      description: One of the six landing content blocks (04-DATA-MODEL.md § 6, D-99).
      enum: [hero, about, hours, contacts, social, seo]

    ContentLocaleBlock:
      type: object
      description: One locale's saved content for a key.
      required:
        - data
        - updatedAt
      properties:
        data:
          type: object
          additionalProperties: true
          description: >
            Raw per-key data, shaped per `ContentKey` (`ContentHero`,
            `ContentAbout`, `ContentHours`, `ContentContacts`,
            `ContentSocial` or `ContentSeo`, O-19) — modelled as a
            generic object here because the discriminator (`key`) is a
            sibling path parameter, not a field of this object, so a
            `oneOf` union does not apply; the server validates it against
            the matching named schema by hand.
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid
          description: Absent when the row predates `updated_by` being set (e.g. the demo seed).

    ContentResource:
      type: object
      description: Response body for `GET /content/{key}` — every locale saved for that key, no fallback (O-19).
      required:
        - key
        - locales
      properties:
        key:
          $ref: "#/components/schemas/ContentKey"
        locales:
          type: object
          description: Each of `uz`/`ru`/`en` is absent when that locale was never saved.
          properties:
            uz:
              $ref: "#/components/schemas/ContentLocaleBlock"
            ru:
              $ref: "#/components/schemas/ContentLocaleBlock"
            en:
              $ref: "#/components/schemas/ContentLocaleBlock"

    ContentPut:
      type: object
      description: Request body for `PUT /content/{key}`.
      required:
        - locale
        - data
      properties:
        locale:
          $ref: "#/components/schemas/Locale"
        data:
          type: object
          additionalProperties: true
          description: Validated server-side against `key`'s O-19 schema; see `ContentLocaleBlock.data`.

    ContentBlock:
      type: object
      description: Response body for `PUT /content/{key}` — the stored block.
      required:
        - key
        - locale
        - data
        - updatedAt
      properties:
        key:
          $ref: "#/components/schemas/ContentKey"
        locale:
          $ref: "#/components/schemas/Locale"
        data:
          type: object
          additionalProperties: true
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid

    ContentHero:
      type: object
      description: >
        O-19 shape for `key: hero`. Not referenced by any path directly
        (`ContentPut.data`/`ContentLocaleBlock.data` are generic — see
        their description) — generated for `content.Service` to validate
        and decode against (`skip-prune: true`, `api/oapi-codegen.yaml`).
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 200
        tagline:
          type: string
          maxLength: 300
        imageMediaId:
          type: string
          format: uuid

    ContentAbout:
      type: object
      description: >-
        O-19 shape for `key: about`. See `ContentHero`'s description for why this is unreferenced by any path.
      additionalProperties: false
      required:
        - body
      properties:
        title:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 5000
          description: Plain text; paragraphs are separated by blank lines. No HTML (O-19).

    ContentHoursDay:
      type: object
      description: One row of `ContentHours.days`.
      additionalProperties: false
      required:
        - day
        - closed
      properties:
        day:
          type: string
          enum: [mon, tue, wed, thu, fri, sat, sun]
        closed:
          type: boolean
        open:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: "`HH:MM`, required when `closed` is false."
        close:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: "`HH:MM`, required when `closed` is false; must be after `open`."

    ContentHours:
      type: object
      description: >
        O-19/D-107 shape for `key: hours`. See `ContentHero`'s
        description for why this is unreferenced by any path. `days`
        must have exactly 7 rows, one per distinct weekday (validated in
        Go — JSON Schema's `minItems`/`maxItems` catch the count but not
        the "distinct, all seven" rule).
      additionalProperties: false
      required:
        - days
      properties:
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: "#/components/schemas/ContentHoursDay"
        note:
          type: string
          maxLength: 300
          description: Free text; the only translated part of this block (D-107).

    ContentContacts:
      type: object
      description: >-
        O-19 shape for `key: contacts`. See `ContentHero`'s description for why this is unreferenced by any path.
      additionalProperties: false
      required:
        - phone
        - address
      properties:
        phone:
          type: string
          maxLength: 30
        address:
          type: string
          maxLength: 300
        mapUrl:
          type: string
          format: uri
          maxLength: 500
          description: Yandex Maps link; `https` only (validated in Go).

    ContentSocial:
      type: object
      description: >-
        O-19 shape for `key: social`. See `ContentHero`'s description for why this is unreferenced by any path.
      additionalProperties: false
      properties:
        telegram:
          type: string
          format: uri
          maxLength: 300
        instagram:
          type: string
          format: uri
          maxLength: 300

    ContentSeo:
      type: object
      description: >-
        O-19 shape for `key: seo`. See `ContentHero`'s description for why this is unreferenced by any path.
      additionalProperties: false
      required:
        - title
        - description
      properties:
        title:
          type: string
          maxLength: 70
        description:
          type: string
          maxLength: 200

  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`.
      required: false
      schema:
        type: string

    AcceptLanguage:
      name: Accept-Language
      in: header
      description: Preferred response locale.
      required: false
      schema:
        type: string
        enum: [uz, ru, en]

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: >
        Client-generated key (docs/05-API.md § Conventions); a replay
        with the same key returns the original result instead of
        repeating the operation.
      required: false
      schema:
        type: string
        maxLength: 128

  responses:
    Unauthenticated:
      description: The request has no valid session or bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: The authenticated caller may not perform this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: The resource does not exist (or is outside the caller's shop).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ValidationFailed:
      description: The request body failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Conflict:
      description: >
        The request conflicts with the current state of the resource
        (e.g. a duplicate username, phone or location name within the shop).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Internal:
      description: An unexpected error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

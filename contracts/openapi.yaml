        `/products/{id}/variants` and `/variants/{id}`, not here.
      properties:
        categoryId:
          type: ["string", "null"]
          format: uuid
        slug:
          type: string
        sku:
          type: ["string", "null"]
        unitId:
          type: string
          format: uuid
        basePrice:
          $ref: "#/components/schemas/Decimal"
        costPrice:
          type: ["string", "null"]
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
        promoPrice:
          type: ["string", "null"]
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
        promoFrom:
          type: ["string", "null"]
          format: date-time
        promoTo:
          type: ["string", "null"]
          format: date-time
        isActive:
          type: boolean
        isFeatured:
          type: boolean
        lowStockThreshold:
          type: ["integer", "null"]
        translations:
          $ref: "#/components/schemas/Translations"

    ProductList:
      type: object
      description: Cursor-paginated envelope for `GET /products`.
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        nextCursor:

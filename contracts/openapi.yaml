openapi: 3.1.0

info:
  title: Savdo API
  version: 0.1.0
  description: >
    Savdo ("trade" in Uzbek) — a light ERP + CRM for small shops. This
    contract is the single source of truth (ADR-002): `make generate`
    produces the Go server interface/types (oapi-codegen) and the
    TypeScript types + typed fetch client (`@savdo/api-client`) from it.
    Nobody hand-declares a request/response shape on either side.

servers:
  - url: /v1
    description: >
      All paths below are relative to this prefix, e.g. `GET /healthz`
      here is served at `GET /v1/healthz`.

security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: ops
    description: Health and other operational endpoints.
  - name: auth
    description: Login, logout, the current user and session management.
  - name: shop
    description: Shop settings, locations and staff (Phase 1).
  - name: catalog
    description: >
      Units, attribute definitions, categories, products and variants
      (Phase 2). Reads are any authenticated role; `Product`/`Variant`
      carry role-dependent optional fields (§ Conventions) — cost fields
      never reach a cashier (ADR-010). Writes require `catalog.write`
      (manager+).
  - name: media
    description: >
      Image upload and product image management (Phase 2, D-34).
      `catalog.write` (manager+).

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [ops]
      summary: Liveness check.
      description: Reports the process is up. Does not touch the database.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"

  /readyz:
    get:
      operationId: getReadyz
      tags: [ops]
      summary: Readiness check.
      description: >
        Reports whether the API's dependencies (currently the database) are
        reachable. Used by the orchestrator/deploy tooling, not by clients.
      security: []
      responses:
        "200":
          description: All checks passed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: One or more checks failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate with username and password.
      description: >
        For `client: web`, sets the `savdo_session` cookie and omits
        `token`. For `client: mobile`, returns `token` for the caller to
        send as `Authorization: Bearer <token>`; no cookie is set (D-29).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session.
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The authenticated user, their shop and their permissions.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: The authenticated user's own sessions.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags: [auth]
      summary: Revoke one of the authenticated user's own sessions.
      description: >
        Revoking the caller's own current session behaves like `POST
        /auth/logout`. Revoking a session belonging to another user is not
        possible here — the owner revokes staff sessions by deactivating
        the staff member (`PATCH /staff/{id}`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /shop:
    get:
      operationId: getShop
      tags: [shop]
      summary: The current shop's settings.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      operationId: updateShop
      tags: [shop]
      summary: Update shop settings.
      description: Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /locations:
    get:
      operationId: listLocations
      tags: [shop]
      summary: List the shop's locations.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createLocation
      tags: [shop]
      summary: Create a location.
      description: Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /locations/{id}:
    patch:
      operationId: updateLocation
      tags: [shop]
      summary: Update a location.
      description: Owner only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /staff:
    get:
      operationId: listStaff
      tags: [shop]
      summary: List the shop's staff.
      description: Owner only.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createStaff
      tags: [shop]
      summary: Create a staff member (manager or cashier).
      description: Owner only. The password is set here; see D-28 for resets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /staff/{id}:
    patch:
      operationId: updateStaff
      tags: [shop]
      summary: Update a staff member.
      description: Owner only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /staff/{id}/password:
    post:
      operationId: setStaffPassword
      tags: [shop]
      summary: Set a staff member's password.
      description: >
        Owner only (D-28). There is no self-service "forgot password" until
        Phase 7's Telegram OTP flow.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStaffPassword"
      responses:
        "204":
          description: Password set.
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /units:
    get:
      operationId: listUnits
      tags: [catalog]
      summary: List the shop's units of measure.
      description: >
        Seeded per shop, read-only in Phase 2 (docs/04-DATA-MODEL.md § 2).
        Not cursor-paginated — the set is small and fixed for now.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /attribute-definitions:
    get:
      operationId: listAttributeDefinitions
      tags: [catalog]
      summary: List the shop's attribute definitions (e.g. size, colour).
      description: >
        Not cursor-paginated — seeded with a handful of entries (D-32) and
        expected to stay small.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDefinitionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createAttributeDefinition
      tags: [catalog]
      summary: Create an attribute definition.
      description: Requires `catalog.write` (manager+).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributeDefinitionCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDefinition"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /attribute-definitions/{id}:
    patch:
      operationId: updateAttributeDefinition
      tags: [catalog]
      summary: Update an attribute definition.
      description: >
        Requires `catalog.write` (manager+). `code` is not patchable —
        variants already reference it by key (docs/04-DATA-MODEL.md § 2).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributeDefinitionPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDefinition"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List the shop's categories as a flat list.
      description: >
        Flat, not cursor-paginated — the client builds the tree from
        `parentId`. Depth is capped at 3 (docs/04-DATA-MODEL.md § 2).
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createCategory
      tags: [catalog]
      summary: Create a category.
      description: >
        Requires `catalog.write` (manager+). `400 fields.parentId: invalid`
        when the parent chain would exceed depth 3.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /categories/{id}:
    get:
      operationId: getCategory
      tags: [catalog]
      summary: Get a category.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCategory
      tags: [catalog]
      summary: Update a category.
      description: >
        Requires `catalog.write` (manager+). `400 fields.parentId: invalid`
        when re-parenting would exceed depth 3 or create a cycle.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteCategory
      tags: [catalog]
      summary: Soft-delete a category.
      description: >
        Requires `catalog.write` (manager+). `409 CONFLICT
        details.field: products` when products still reference this
        category (assumption: D-32/D-34 area, no cascading delete).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List products.
      description: >
        Cursor-paginated. `Product`'s `costPrice`/`translations` are
        present only for owner/manager, never for a cashier (§
        Conventions, ADR-010).
      parameters:
        - name: q
          in: query
          description: Free-text search over product name (Postgres ILIKE/trigram).
          required: false
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createProduct
      tags: [catalog]
      summary: Create a product.
      description: Requires `catalog.write` (manager+).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Get a product, including its variants and images.
      description: >
        `costPrice`/`translations` are present only for owner/manager,
        like `GET /products` (§ Conventions).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProduct
      tags: [catalog]
      summary: Update a product.
      description: Requires `catalog.write` (manager+).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteProduct
      tags: [catalog]
      summary: Soft-delete a product.
      description: Requires `catalog.write` (manager+).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{id}/variants:
    get:
      operationId: listVariants
      tags: [catalog]
      summary: List a product's variants.
      description: >
        Not cursor-paginated — a product has at most a handful of
        variants. `Variant`'s `costOverride` is present only for
        owner/manager (§ Conventions).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createVariant
      tags: [catalog]
      summary: Add a variant to a product.
      description: Requires `catalog.write` (manager+).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /variants/{id}:
    patch:
      operationId: updateVariant
      tags: [catalog]
      summary: Update a variant.
      description: Requires `catalog.write` (manager+).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteVariant
      tags: [catalog]
      summary: Soft-delete a variant.
      description: >
        Requires `catalog.write` (manager+). `400 fields.variantId:
        invalid` when this is the product's only variant — every product
        must keep at least one (docs/04-DATA-MODEL.md § 2).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /media:
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload an image.
      description: >
        Requires `catalog.write` (manager+). Generates thumb/card/full
        sizes as WebP (ADR-008). `400 fields.file: invalid` for an
        unsupported format, `400 fields.file: too_long` over the size
        limit. Decoding and deriving is bounded by a process-wide
        admission queue; `429` means the server already has as many
        uploads in flight as it's willing to hold — retry after the
        given delay.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MediaUpload"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFile"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /products/{id}/images:
    post:
      operationId: addProductImage
      tags: [media]
      summary: Attach an uploaded image to a product.
      description: >
        Requires `catalog.write` (manager+). `400 fields.mediaId:
        invalid` once the product already has 8 images (D-34); `409
        CONFLICT details.field: mediaId` when this media file is already
        attached to the product (`product_images` unique
        `(product_id, media_id)`, docs/04-DATA-MODEL.md § 2).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductImageCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /products/{id}/images/{imageId}:
    delete:
      operationId: removeProductImage
      tags: [media]
      summary: Remove an image from a product.
      description: Requires `catalog.write` (manager+). Hard delete (join row).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{id}/images/order:
    patch:
      operationId: reorderProductImages
      tags: [media]
      summary: Reorder a product's images and/or change its cover image.
      description: Requires `catalog.write` (manager+).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductImageOrder"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImageList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: savdo_session
      description: >
        Session cookie set by `POST /auth/login` for `client: web`
        (`SameSite=Lax`, D-29). Every mutating request (POST/PATCH/PUT/
        DELETE) authenticated this way must also send `X-Requested-With:
        savdo`; requests without it are rejected as a CSRF check enforced
        by middleware (ADR-005, docs/05-API.md § Conventions).
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Opaque session token returned by `POST /auth/login` for `client:
        mobile` (ADR-005), sent as `Authorization: Bearer <token>`.

  schemas:
    Healthz:
      type: object
      description: Response body for `GET /healthz`.
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]

    Readiness:
      type: object
      description: Response body for `GET /readyz` (200 and 503 share this shape).
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          required:
            - db
          properties:
            db:
              type: string
              enum: [ok, error]

    ErrorCode:
      type: string
      description: >
        Machine-readable error codes (ADR-013). A client translates a code
        to a display sentence; the API never returns one. Adding a new
        error code means adding it here first.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - INTERNAL

    Error:
      type: object
      description: The error envelope every non-2xx JSON response uses (ADR-013).
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            details:
              type: object
              description: >
                Optional machine-readable context, shape depends on `code`.
                For `VALIDATION_FAILED` this is `{ "fields": { "<field>":
                "<reason>" } }`.

    Decimal:
      type: string
      format: decimal
      pattern: '^-?\d+(\.\d+)?$'
      description: money and quantities as decimal strings (ADR-007)

    Locale:
      type: string
      description: A UI/data locale (ADR-012).
      enum: [uz, ru, en]

    Role:
      type: string
      description: A user's role (04-DATA-MODEL.md § 7 Permissions).
      enum: [owner, manager, cashier]

    StaffRole:
      type: string
      description: >
        The roles the owner can assign when creating or editing a staff
        member. `owner` is not assignable — there is exactly one owner,
        seeded (D-30).
      enum: [manager, cashier]

    SessionClient:
      type: string
      description: Which client created a session (D-29).
      enum: [web, mobile]

    LocationKind:
      type: string
      enum: [store, warehouse]

    User:
      type: object
      required:
        - id
        - username
        - fullName
        - phone
        - role
        - locale
        - isActive
        - lastLoginAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        fullName:
          type: string
        phone:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/Role"
        locale:
          $ref: "#/components/schemas/Locale"
        isActive:
          type: boolean
        lastLoginAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    UserList:
      type: object
      description: Cursor-paginated envelope for `GET /staff`.
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        nextCursor:
          type: ["string", "null"]

    Shop:
      type: object
      required:
        - id
        - slug
        - name
        - currency
        - timezone
        - defaultLocale
        - allowNegativeStock
        - updateCostOnPurchase
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        currency:
          type: string
          description: ISO 4217 currency code, one per shop (ADR-007). `UZS` in MVP.
        timezone:
          type: string
          description: IANA timezone name, e.g. `Asia/Tashkent`.
        defaultLocale:
          $ref: "#/components/schemas/Locale"
        allowNegativeStock:
          type: boolean
        updateCostOnPurchase:
          type: boolean

    ShopPatch:
      type: object
      description: Partial update — only provided fields change.
      properties:
        name:
          type: string
        timezone:
          type: string
        defaultLocale:
          $ref: "#/components/schemas/Locale"
        allowNegativeStock:
          type: boolean
        updateCostOnPurchase:
          type: boolean

    Location:
      type: object
      required:
        - id
        - name
        - kind
        - isDefault
        - isActive
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LocationKind"
        isDefault:
          type: boolean
        isActive:
          type: boolean

    LocationList:
      type: object
      description: Cursor-paginated envelope for `GET /locations`.
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Location"
        nextCursor:
          type: ["string", "null"]

    LocationCreate:
      type: object
      required:
        - name
        - kind
      properties:
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LocationKind"
        isDefault:
          type: boolean

    LocationPatch:
      type: object
      description: Partial update — only provided fields change.
      properties:
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LocationKind"
        isDefault:
          type: boolean
        isActive:
          type: boolean

    Session:
      type: object
      required:
        - id
        - client
        - userAgent
        - ip
        - createdAt
        - lastSeenAt
        - expiresAt
        - current
      properties:
        id:
          type: string
          format: uuid
        client:
          $ref: "#/components/schemas/SessionClient"
        userAgent:
          type: ["string", "null"]
        ip:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: >
            Recomputed on every authenticated use, sliding per `client`
            (D-29): 30 days for `mobile`, 7 days for `web`.
        current:
          type: boolean
          description: Whether this is the session the request was authenticated with.

    SessionList:
      type: object
      description: Cursor-paginated envelope for `GET /auth/sessions`.
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        nextCursor:
          type: ["string", "null"]

    LoginRequest:
      type: object
      required:
        - username
        - password
        - client
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 128
        client:
          $ref: "#/components/schemas/SessionClient"

    LoginResponse:
      type: object
      required:
        - user
        - session
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/Session"
        token:
          type: string
          description: >
            Bearer token for `client: mobile` only. Absent for `client:
            web`, which authenticates with the `savdo_session` cookie
            instead.

    Me:
      type: object
      required:
        - user
        - shop
        - permissions
      properties:
        user:
          $ref: "#/components/schemas/User"
        shop:
          $ref: "#/components/schemas/Shop"
        permissions:
          type: array
          items:
            type: string
          description: >
            Machine-readable capability strings the UI uses to show/hide
            actions. The API remains the enforcement point (ADR-010).

    StaffCreate:
      type: object
      required:
        - username
        - password
        - fullName
        - role
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 128
        fullName:
          type: string
        phone:
          type: string
        role:
          $ref: "#/components/schemas/StaffRole"
        locale:
          $ref: "#/components/schemas/Locale"

    StaffPatch:
      type: object
      description: Partial update — only provided fields change.
      properties:
        fullName:
          type: string
        phone:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/StaffRole"
        isActive:
          type: boolean
        locale:
          $ref: "#/components/schemas/Locale"

    SetStaffPassword:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 128

    TranslationEntry:
      type: object
      description: One locale's name/description for a translatable entity.
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string

    Translations:
      type: object
      description: >
        Per-locale name/description (ADR-012), keyed by `Locale`. On
        create, an entry for the shop's own default locale is required —
        expressible only as a service-level rule, since the JSON Schema
        can't know a given shop's `defaultLocale` value. On PATCH, each
        provided locale entry fully replaces the stored entry for that
        locale; omitted locales are left unchanged. Response fields
        outside this object (`name`/`description`/`locale`/
        `translationFallback`) are the entity resolved for the caller's
        `Accept-Language`, fallback order `requested → uz → any`.
      properties:
        uz:
          $ref: "#/components/schemas/TranslationEntry"
        ru:
          $ref: "#/components/schemas/TranslationEntry"
        en:
          $ref: "#/components/schemas/TranslationEntry"

    Unit:
      type: object
      description: A unit of measure (docs/04-DATA-MODEL.md § 2). Seeded, read-only in Phase 2.
      required:
        - id
        - code
        - precision
        - name
        - locale
        - translationFallback
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: e.g. `pcs`, `kg`, `m`.
        precision:
          type: integer
          description: Decimal places a quantity in this unit is stored/displayed with (0 for `pcs`, 3 for `kg`).
        name:
          type: string
          description: Resolved for the caller's `Accept-Language`.
        locale:
          $ref: "#/components/schemas/Locale"
        translationFallback:
          type: boolean

    UnitList:
      type: object
      description: Flat envelope for `GET /units` (not cursor-paginated).
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Unit"

    AttributeDefinition:
      type: object
      description: A per-shop variant attribute, e.g. size or colour (D-32).
      required:
        - id
        - code
        - sortOrder
        - name
        - locale
        - translationFallback
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Stable key `product_variants.attributes` values are keyed by, e.g. `size`.
        sortOrder:
          type: integer
        name:
          type: string
          description: Resolved for the caller's `Accept-Language`.
        locale:
          $ref: "#/components/schemas/Locale"
        translationFallback:
          type: boolean
        translations:
          $ref: "#/components/schemas/Translations"

    AttributeDefinitionCreate:
      type: object
      required:
        - code
        - translations
      properties:
        code:
          type: string
        sortOrder:
          type: integer
        translations:
          $ref: "#/components/schemas/Translations"

    AttributeDefinitionPatch:
      type: object
      description: Partial update — only provided fields change. `code` is not patchable.
      properties:
        sortOrder:
          type: integer
        translations:
          $ref: "#/components/schemas/Translations"

    AttributeDefinitionList:
      type: object
      description: Flat envelope for `GET /attribute-definitions` (not cursor-paginated).
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AttributeDefinition"

    Category:
      type: object
      required:
        - id
        - parentId
        - slug
        - sortOrder
        - isActive
        - imageId
        - name
        - description
        - locale
        - translationFallback
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: ["string", "null"]
          format: uuid
        slug:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        imageId:
          type: ["string", "null"]
          format: uuid
        name:
          type: string
          description: Resolved for the caller's `Accept-Language`.
        description:
          type: ["string", "null"]
        locale:
          $ref: "#/components/schemas/Locale"
        translationFallback:
          type: boolean
        translations:
          $ref: "#/components/schemas/Translations"

    CategoryCreate:
      type: object
      required:
        - translations
      properties:
        parentId:
          type: string
          format: uuid
        slug:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        imageId:
          type: string
          format: uuid
        translations:
          $ref: "#/components/schemas/Translations"

    CategoryPatch:
      type: object
      description: Partial update — only provided fields change.
      properties:
        parentId:
          type: ["string", "null"]
          format: uuid
          description: Explicit `null` moves the category to the top level.
        slug:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        imageId:
          type: ["string", "null"]
          format: uuid
          description: Explicit `null` removes the category's image.
        translations:
          $ref: "#/components/schemas/Translations"

    CategoryList:
      type: object
      description: Flat envelope for `GET /categories` (not cursor-paginated; the client builds the tree from `parentId`).
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    AttributeValues:
      type: object
      description: >
        A variant's attribute values, keyed by `attribute_definitions.code`
        (e.g. `{"size": "L", "color": "blue"}`, D-32).
      additionalProperties:
        type: string

    Availability:
      type: string
      description: Public/bot-facing stock signal — never a quantity (ADR-010, hard rule 4/5).
      enum: [in_stock, low, out_of_stock]

    Variant:
      type: object
      description: >
        `costOverride` is present only when the caller has the
        `cost.read` permission; absent (not null) otherwise (ADR-010).
      required:
        - id
        - sku
        - barcode
        - attributes
        - priceOverride
        - isActive
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: ["string", "null"]
        barcode:
          type: ["string", "null"]
        attributes:
          $ref: "#/components/schemas/AttributeValues"
        priceOverride:
          type: ["string", "null"]
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
        costOverride:
          type: ["string", "null"]
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
          description: >
            Present only when the caller has the `cost.read` permission;
            absent (not null) otherwise (ADR-010).
        isActive:
          type: boolean

    VariantPublic:
      type: object
      description: >
        Defined now for Phase 6's public catalogue (D-32/D-34); no path
        references it yet. No cost, no `isActive` (only active variants
        are ever returned publicly); `availability` replaces any quantity
        (hard rule 4/5).
      required:
        - id
        - sku
        - barcode
        - attributes
        - priceOverride
        - availability
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: ["string", "null"]
        barcode:
          type: ["string", "null"]
        attributes:
          $ref: "#/components/schemas/AttributeValues"
        priceOverride:
          type: ["string", "null"]
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
        availability:
          $ref: "#/components/schemas/Availability"

    VariantCreate:
      type: object
      required:
        - attributes
      properties:
        sku:
          type: string
        barcode:
          type: string
        attributes:
          $ref: "#/components/schemas/AttributeValues"
        priceOverride:
          $ref: "#/components/schemas/Decimal"
        costOverride:
          $ref: "#/components/schemas/Decimal"
        isActive:
          type: boolean

    VariantPatch:
      type: object
      description: Partial update — only provided fields change.
      properties:
        sku:
          type: ["string", "null"]
        barcode:
          type: ["string", "null"]
        attributes:
          $ref: "#/components/schemas/AttributeValues"
        priceOverride:
          type: ["string", "null"]
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
        costOverride:
          type: ["string", "null"]
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
        isActive:
          type: boolean

    VariantList:
      type: object
      description: Flat envelope for `GET /products/{id}/variants` (not cursor-paginated).
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Variant"

    Product:
      type: object
      description: >
        `costPrice` and `translations` are present only when the caller
        has the `cost.read` / `catalog.write` permission; absent (not
        null) otherwise (ADR-010).
      required:
        - id
        - categoryId
        - slug
        - sku
        - unitId
        - basePrice
        - promoPrice
        - promoFrom
        - promoTo
        - isActive
        - isFeatured
        - name
        - description
        - locale
        - translationFallback
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: ["string", "null"]
          format: uuid
        slug:
          type: string
        sku:
          type: ["string", "null"]
        unitId:
          type: string
          format: uuid
        basePrice:
          $ref: "#/components/schemas/Decimal"
        costPrice:
          type: string
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
          description: >
            Present only when the caller has the `cost.read` permission;
            absent (not null) otherwise (ADR-010).
        promoPrice:
          type: ["string", "null"]
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
        promoFrom:
          type: ["string", "null"]
          format: date-time
        promoTo:
          type: ["string", "null"]
          format: date-time
        isActive:
          type: boolean
        isFeatured:
          type: boolean
        name:
          type: string
          description: Resolved for the caller's `Accept-Language`.
        description:
          type: ["string", "null"]
        locale:
          $ref: "#/components/schemas/Locale"
        translationFallback:
          type: boolean
        translations:
          $ref: "#/components/schemas/Translations"
          description: >
            Present only when the caller has the `catalog.write`
            permission; absent otherwise (ADR-010).
        variants:
          type: array
          items:
            $ref: "#/components/schemas/Variant"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"

    ProductPublic:
      type: object
      description: >
        Defined now for Phase 6's public catalogue (D-32/D-34); no path
        references it yet. Only active products/variants are ever
        returned this way; variants carry `availability`, never cost or
        quantity (hard rule 4/5).
      required:
        - id
        - categoryId
        - slug
        - sku
        - unitId
        - basePrice
        - promoPrice
        - promoFrom
        - promoTo
        - isActive
        - isFeatured
        - name
        - description
        - locale
        - translationFallback
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: ["string", "null"]
          format: uuid
        slug:
          type: string
        sku:
          type: ["string", "null"]
        unitId:
          type: string
          format: uuid
        basePrice:
          $ref: "#/components/schemas/Decimal"
        promoPrice:
          type: ["string", "null"]
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
        promoFrom:
          type: ["string", "null"]
          format: date-time
        promoTo:
          type: ["string", "null"]
          format: date-time
        isActive:
          type: boolean
        isFeatured:
          type: boolean
        name:
          type: string
          description: Resolved for the caller's `Accept-Language`.
        description:
          type: ["string", "null"]
        locale:
          $ref: "#/components/schemas/Locale"
        translationFallback:
          type: boolean
        variants:
          type: array
          items:
            $ref: "#/components/schemas/VariantPublic"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"

    ProductCreate:
      type: object
      required:
        - unitId
        - basePrice
        - translations
      properties:
        categoryId:
          type: string
          format: uuid
        slug:
          type: string
        sku:
          type: string
        unitId:
          type: string
          format: uuid
        basePrice:
          $ref: "#/components/schemas/Decimal"
        costPrice:
          $ref: "#/components/schemas/Decimal"
        promoPrice:
          $ref: "#/components/schemas/Decimal"
        promoFrom:
          type: string
          format: date-time
        promoTo:
          type: string
          format: date-time
        isActive:
          type: boolean
        isFeatured:
          type: boolean
        translations:
          $ref: "#/components/schemas/Translations"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/VariantCreate"

    ProductPatch:
      type: object
      description: >
        Partial update — only provided fields change. `sku`,
        `promoPrice`, `promoFrom`, `promoTo`, `categoryId` and
        `costPrice` are nullable (D-35): explicit `null` clears the
        field. Variants are managed through `/products/{id}/variants`
        and `/variants/{id}`, not here.
      properties:
        categoryId:
          type: ["string", "null"]
          format: uuid
        slug:
          type: string
        sku:
          type: ["string", "null"]
        unitId:
          type: string
          format: uuid
        basePrice:
          $ref: "#/components/schemas/Decimal"
        costPrice:
          type: ["string", "null"]
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
        promoPrice:
          type: ["string", "null"]
          format: decimal
          pattern: '^-?\d+(\.\d+)?$'
        promoFrom:
          type: ["string", "null"]
          format: date-time
        promoTo:
          type: ["string", "null"]
          format: date-time
        isActive:
          type: boolean
        isFeatured:
          type: boolean
        translations:
          $ref: "#/components/schemas/Translations"

    ProductList:
      type: object
      description: Cursor-paginated envelope for `GET /products`.
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        nextCursor:
          type: ["string", "null"]

    MediaUpload:
      type: object
      description: Request body for `POST /media` (`multipart/form-data`).
      required:
        - file
      properties:
        file:
          type: string
          format: binary

    MediaUrls:
      type: object
      required:
        - thumb
        - card
        - full
      properties:
        thumb:
          type: string
          format: uri
        card:
          type: string
          format: uri
        full:
          type: string
          format: uri

    MediaFile:
      type: object
      description: Response for `POST /media` (ADR-008 — thumb 200/card 600/full 1600, WebP).
      required:
        - id
        - mime
        - width
        - height
        - sizeBytes
        - urls
      properties:
        id:
          type: string
          format: uuid
        mime:
          type: string
        width:
          type: integer
        height:
          type: integer
        sizeBytes:
          type: integer
        urls:
          $ref: "#/components/schemas/MediaUrls"

    ProductImage:
      type: object
      required:
        - id
        - mediaId
        - variantId
        - isCover
        - sortOrder
        - urls
      properties:
        id:
          type: string
          format: uuid
        mediaId:
          type: string
          format: uuid
        variantId:
          type: ["string", "null"]
          format: uuid
        isCover:
          type: boolean
        sortOrder:
          type: integer
        urls:
          $ref: "#/components/schemas/MediaUrls"

    ProductImageCreate:
      type: object
      required:
        - mediaId
      properties:
        mediaId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
          description: Ties this image to one variant, e.g. a colour (D-34).
        isCover:
          type: boolean

    ProductImageOrder:
      type: object
      description: Request body for `PATCH /products/{id}/images/order`.
      required:
        - imageIds
      properties:
        imageIds:
          type: array
          items:
            type: string
            format: uuid
          description: Every image id belonging to the product, in the new display order.
        coverImageId:
          type: string
          format: uuid

    ProductImageList:
      type: object
      description: Envelope for `PATCH /products/{id}/images/order`'s response.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"

  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`.
      required: false
      schema:
        type: string

    AcceptLanguage:
      name: Accept-Language
      in: header
      description: Preferred response locale.
      required: false
      schema:
        type: string
        enum: [uz, ru, en]

  responses:
    Unauthenticated:
      description: The request has no valid session or bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: The authenticated caller may not perform this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: The resource does not exist (or is outside the caller's shop).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ValidationFailed:
      description: The request body failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Conflict:
      description: >
        The request conflicts with the current state of the resource
        (e.g. a duplicate username, phone or location name within the shop).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Internal:
      description: An unexpected error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

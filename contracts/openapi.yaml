openapi: 3.1.0

info:
  title: Savdo API
  version: 0.1.0
  description: >
    Savdo ("trade" in Uzbek) — a light ERP + CRM for small shops. This
    contract is the single source of truth (ADR-002): `make generate`
    produces the Go server interface/types (oapi-codegen) and the
    TypeScript types + typed fetch client (`@savdo/api-client`) from it.
    Nobody hand-declares a request/response shape on either side.

servers:
  - url: /v1
    description: >
      All paths below are relative to this prefix, e.g. `GET /healthz`
      here is served at `GET /v1/healthz`.

security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: ops
    description: Health and other operational endpoints.
  - name: auth
    description: Login, logout, the current user and session management.
  - name: shop
    description: Shop settings, locations and staff (Phase 1).
  - name: catalog
    description: >
      Units, attribute definitions, categories, products and variants
      (Phase 2). Reads are any authenticated role; `Product`/`Variant`
      carry role-dependent optional fields (§ Conventions) — cost fields
      never reach a cashier (ADR-010). Writes require `catalog.write`
      (manager+).
  - name: media
    description: >
      Image upload and product image management (Phase 2, D-34); also the
      Phase 3 image retag operation (D-43), same permission.
      `catalog.write` (manager+).
  - name: suppliers
    description: Suppliers for purchases (Phase 3). `manager+`.
  - name: purchases
    description: >
      Stock purchases from suppliers (Phase 3). `manager+`. `number` is
      server-generated (D-45); `totalCost` is server-computed, never
      client-supplied (hard rule 8).
  - name: stock
    description: >
      Stock levels, movements, adjustments and transfers (Phase 3,
      correctness-critical, ADR-006). `GET /stock/levels` is open to any
      authenticated role (D-40); every other stock operation is
      `manager+`. Quantities are signed decimal strings (ADR-007); a
      movement never takes a level below zero (D-41).
  - name: customers
    description: >
      CRM customers (Phase 4). `cashier+` may list, search and create;
      `manager+` may update and soft-delete.
  - name: sales
    description: >
      Sales, voids and returns (Phase 4, correctness-critical, ADR-014).
      Line prices always come from the catalogue, never the client
      (D-56); a completed sale is never mutated — only voided (same
      calendar day, manager+, D-59) or corrected with a partial return
      (manager+, D-58, D-61). `unitCost` and margin are omitted from a
      cashier's view (D-63, ADR-010).
  - name: reports
    description: >
      Sales reports (Phase 4). `manager+`, except `/reports/sales/summary`
      which a cashier may also call, scoped to their own current day
      (D-55). `cost`/`margin` are present only for manager+ (ADR-010). Low
      stock reporting reuses `GET /stock/low` (Phase 3, D-55).
  - name: content
    description: >
      Landing page content blocks (Phase 6, D-99). `manager+` reads and
      writes one key (hero/about/hours/contacts/social/seo) per locale;
      each key's `data` is validated server-side against its O-19 shape.
      `GET /public/shop` composes these with fallback (D-104) for the
      public landing.
  - name: public
    description: >
      Unauthenticated landing endpoints (Phase 6, D-99, D-103, D-105,
      D-106, O-20/O-21/O-22): shop + content blocks, active categories,
      products (filterable, paginated) and one product by slug, resolved
      for `PUBLIC_SHOP_SLUG`. Prices and availability only — never cost,
      margin or quantities (ADR-010). `security: []`; responses carry
      `Cache-Control: public, max-age=60` and a strong `ETag`
      (`If-None-Match` → `304`), served from an in-process cache keyed by
      shop + path + query + resolved locale, cleared on a content `PUT`
      or a catalogue product/category/variant/image write.

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [ops]
      summary: Liveness check.
      description: Reports the process is up. Does not touch the database.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"

  /readyz:
    get:
      operationId: getReadyz
      tags: [ops]
      summary: Readiness check.
      description: >
        Reports whether the API's dependencies (currently the database) are
        reachable. Used by the orchestrator/deploy tooling, not by clients.
      security: []
      responses:
        "200":
          description: All checks passed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: One or more checks failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate with username and password.
      description: >
        For `client: web`, sets the `savdo_session` cookie and omits
        `token`. For `client: mobile`, returns `token` for the caller to
        send as `Authorization: Bearer <token>`; no cookie is set (D-29).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session.
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The authenticated user, their shop and their permissions.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: The authenticated user's own sessions.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags: [auth]
      summary: Revoke one of the authenticated user's own sessions.
      description: >
        Revoking the caller's own current session behaves like `POST
        /auth/logout`. Revoking a session belonging to another user is not
        possible here — the owner revokes staff sessions by deactivating
        the staff member (`PATCH /staff/{id}`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /shop:
    get:
      operationId: getShop
      tags: [shop]
      summary: The current shop's settings.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      operationId: updateShop
      tags: [shop]
      summary: Update shop settings.
      description: Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /locations:
    get:
      operationId: listLocations
      tags: [shop]
      summary: List the shop's locations.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createLocation
      tags: [shop]
      summary: Create a location.
      description: Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /locations/{id}:
    patch:
      operationId: updateLocation
      tags: [shop]
      summary: Update a location.
      description: Owner only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /staff:
    get:
      operationId: listStaff
      tags: [shop]
      summary: List the shop's staff.
      description: Owner only.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createStaff
      tags: [shop]
      summary: Create a staff member (manager or cashier).
      description: Owner only. The password is set here; see D-28 for resets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /staff/{id}:
    patch:
      operationId: updateStaff
      tags: [shop]
      summary: Update a staff member.
      description: Owner only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /staff/{id}/password:
    post:
      operationId: setStaffPassword
      tags: [shop]
      summary: Set a staff member's password.
      description: >
        Owner only (D-28). There is no self-service "forgot password" until
        Phase 7's Telegram OTP flow.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStaffPassword"
      responses:
        "204":
          description: Password set.
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /units:
    get:
      operationId: listUnits
      tags: [catalog]
      summary: List the shop's units of measure.
      description: >
        Seeded per shop, read-only in Phase 2 (docs/04-DATA-MODEL.md § 2).
        Not cursor-paginated — the set is small and fixed for now.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /attribute-definitions:
    get:
      operationId: listAttributeDefinitions
      tags: [catalog]
      summary: List the shop's attribute definitions (e.g. size, colour).
      description: >
        Not cursor-paginated — seeded with a handful of entries (D-32) and
        expected to stay small.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDefinitionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createAttributeDefinition
      tags: [catalog]
      summary: Create an attribute definition.
      description: Requires `catalog.write` (manager+).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributeDefinitionCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDefinition"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /attribute-definitions/{id}:
    patch:
      operationId: updateAttributeDefinition
      tags: [catalog]
      summary: Update an attribute definition.
      description: >
        Requires `catalog.write` (manager+). `code` is not patchable —
        variants already reference it by key (docs/04-DATA-MODEL.md § 2).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributeDefinitionPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDefinition"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List the shop's categories as a flat list.
      description: >
        Flat, not cursor-paginated — the client builds the tree from
        `parentId`. Depth is capped at 3 (docs/04-DATA-MODEL.md § 2).
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createCategory
      tags: [catalog]
      summary: Create a category.
      description: >
        Requires `catalog.write` (manager+). `400 fields.parentId: invalid`
        when the parent chain would exceed depth 3.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /categories/{id}:
    get:
      operationId: getCategory
      tags: [catalog]
      summary: Get a category.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCategory
      tags: [catalog]
      summary: Update a category.
      description: >
        Requires `catalog.write` (manager+). `400 fields.parentId: invalid`
        when re-parenting would exceed depth 3 or create a cycle.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteCategory
      tags: [catalog]
      summary: Soft-delete a category.
      description: >
        Requires `catalog.write` (manager+). `409 CONFLICT
        details.field: products` when products still reference this
        category (assumption: D-32/D-34 area, no cascading delete).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List products.
      description: >
        Cursor-paginated. `Product`'s `costPrice`/`translations` are
        present only for owner/manager, never for a cashier (§
        Conventions, ADR-010).
      parameters:
        - name: q
          in: query
          description: Free-text search over product name (Postgres ILIKE/trigram).
          required: false
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createProduct
      tags: [catalog]
      summary: Create a product.
      description: Requires `catalog.write` (manager+).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Get a product, including its variants and images.
      description: >
        `costPrice`/`translations` are present only for owner/manager,
        like `GET /products` (§ Conventions).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProduct
      tags: [catalog]
      summary: Update a product.
      description: Requires `catalog.write` (manager+).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteProduct
      tags: [catalog]
      summary: Soft-delete a product.
      description: Requires `catalog.write` (manager+).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{id}/variants:
    get:
      operationId: listVariants
      tags: [catalog]
      summary: List a product's variants.
      description: >
        Not cursor-paginated — a product has at most a handful of
        variants. `Variant`'s `costOverride` is present only for
        owner/manager (§ Conventions).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createVariant
      tags: [catalog]
      summary: Add a variant to a product.
      description: Requires `catalog.write` (manager+).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":

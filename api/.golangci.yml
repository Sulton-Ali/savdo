version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - revive
    - sqlclosecheck
    - unused
  exclusions:
    paths:
      - gen/
      - internal/db/
    rules:
      # Local dev DSNs in tests (e.g. postgres://savdo:savdo@...) are not
      # secrets; they match infra/.env.example on purpose.
      - path: _test\.go
        linters:
          - gosec

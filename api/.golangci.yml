version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - revive
    - sqlclosecheck
    - unused
  exclusions:
    paths:
      - gen/
      - internal/db/
    rules:
      # gosec G101 flags local dev DSNs in tests (e.g. postgres://savdo:savdo@...)
      # as hardcoded credentials; they match infra/.env.example on purpose.
      # Only G101 is excluded here — other gosec checks stay active in tests.
      - path: _test\.go
        linters:
          - gosec
        text: "G101"

services:
  postgres:
    image: postgres:18.6
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-savdo} -d ${POSTGRES_DB:-savdo}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      # PostgreSQL 18 made PGDATA version-specific (/var/lib/postgresql/18/docker);
      # the image's declared VOLUME moved to the parent /var/lib/postgresql so a
      # future major-version upgrade can use `pg_upgrade --link`.
      # Source: https://hub.docker.com/_/postgres ("Where to Store Data")
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  postgres-data:
